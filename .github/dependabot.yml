# Every action is pinned to a commit SHA, so nothing updates on its own; this keeps the pins
# current. One grouped pull request a week per ecosystem keeps the volume down.
#
# auto-merge.yml arms patch and minor updates (never a major) once CI and dependency-review pass.
# Action updates touch .github/, which CODEOWNERS owns, so they wait for the maintainer's review;
# npm updates touch only package.json and the lockfile, which are not owned, and merge on green.
version: 2
updates:
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    # Majors stay out of the groups, so each one is its own pull request that is never auto-armed.
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    # Expo pins these to one tested set per SDK, and mobile tests mock native modules, so CI
    # passes on versions the SDK does not support (react-native 0.x minors break, and a newer
    # SDK's modules need a new native build). Update them with `npx expo install --fix` or an
    # SDK upgrade instead. React is listed because react-native requires the exact React version
    # it was built against; web and site follow mobile's React with each SDK upgrade.
    # Each rule names update-types so it only skips version updates: a bare ignore also
    # suppresses security updates for that package.
    ignore:
      - dependency-name: "expo"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: "expo-*"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: "@expo/*"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: "jest-expo"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: "babel-preset-expo"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: "react-native"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: "react-native-*"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: "@react-native/*"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: "@react-native-community/*"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: "react"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: "react-dom"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: "@types/react"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: "@types/react-dom"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      # NativeWind 4 compiles mobile styles with Tailwind CSS 3, and prettier-plugin-tailwindcss
      # (mobile only) must match that Tailwind. Web and site are on Tailwind 4, so only majors are
      # skipped there; the 0.x plugin breaks on a minor.
      - dependency-name: "tailwindcss"
        update-types:
          - version-update:semver-major
      - dependency-name: "nativewind"
        update-types:
          - version-update:semver-major
      - dependency-name: "prettier-plugin-tailwindcss"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      # Mobile's Jest transform runs on Babel 7 through babel-preset-expo; Babel 8 plugins need
      # @babel/core 8.
      - dependency-name: "@babel/*"
        update-types: ["version-update:semver-major"]
