# Every action is pinned to a commit SHA, so nothing updates on its own; this keeps the pins
# current. One grouped pull request a week, each one high risk and merged by a human under the
# CI gate. npm dependencies stay manual so every lockfile change is a deliberate one.
version: 2
updates:
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
