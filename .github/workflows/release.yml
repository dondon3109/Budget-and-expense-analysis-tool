name: Production Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-release-main
  cancel-in-progress: false

jobs:
  deploy-and-release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      deployments: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify release source
        env:
          RELEASE_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          remote_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$RELEASE_COMMIT" != "$remote_main" ]]; then
            echo "::error::Skipping stale CI result for $RELEASE_COMMIT; current main is $remote_main."
            exit 1
          fi
          if ! git tag --merged "$RELEASE_COMMIT" --list 'v[0-9]*' | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::No semantic-release baseline tag is reachable from $RELEASE_COMMIT. Create the documented one-time v2.2.1 tag before enabling releases."
            exit 1
          fi
      - name: Determine the next semantic release
        id: next_release
        run: node scripts/next-semantic-release.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify deployment authority
        if: steps.next_release.outputs.release_needed == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_GIT_DEPLOY_DISABLED: ${{ vars.CLOUDFLARE_PRODUCTION_GIT_DEPLOY_DISABLED }}
        run: |
          if [[ "$CLOUDFLARE_GIT_DEPLOY_DISABLED" != "true" ]]; then
            echo "::error::Disable Cloudflare's production Git deployment, then set CLOUDFLARE_PRODUCTION_GIT_DEPLOY_DISABLED=true."
            exit 1
          fi
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" || -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN are required."
            exit 1
          fi
      - name: Validate production deployment configuration
        if: steps.next_release.outputs.release_needed == 'true'
        run: |
          node scripts/validate-deployment-config.mjs
          node scripts/export-production-deployment-env.mjs
          apps/api/node_modules/.bin/wrangler deploy --dry-run --outdir /tmp/zoption-worker-dist \
            --config apps/api/wrangler.deploy.jsonc --env production
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Start or resume the production deployment
        if: steps.next_release.outputs.release_needed == 'true'
        id: deployment
        run: node scripts/github-production-deployment.mjs begin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_COMMIT: ${{ github.event.workflow_run.head_sha }}
      - name: Apply production D1 migrations
        if: >-
          steps.next_release.outputs.release_needed == 'true' &&
          steps.deployment.outputs.worker_deployed != 'true'
        working-directory: apps/api
        run: ./node_modules/.bin/wrangler d1 migrations apply DB --remote --config wrangler.deploy.jsonc --env production
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy production Worker
        if: >-
          steps.next_release.outputs.release_needed == 'true' &&
          steps.deployment.outputs.worker_deployed != 'true'
        working-directory: apps/api
        run: >-
          ./node_modules/.bin/wrangler deploy --config wrangler.deploy.jsonc --env production
          --strict --tag "v${{ steps.next_release.outputs.version }}"
          --message "GitHub Actions release ${{ github.event.workflow_run.head_sha }}"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Checkpoint production Worker deployment
        if: >-
          steps.next_release.outputs.release_needed == 'true' &&
          steps.deployment.outputs.worker_deployed != 'true'
        run: node scripts/github-production-deployment.mjs stage worker
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build versioned production Pages app
        if: >-
          steps.next_release.outputs.release_needed == 'true' &&
          steps.deployment.outputs.pages_deployed != 'true'
        run: pnpm --filter @zoption/web build
        env:
          CF_PAGES: "1"
          ZOPTION_DEPLOY_ENV: production
          ZOPTION_RELEASE_VERSION: ${{ steps.next_release.outputs.version }}
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: https://us.i.posthog.com
      - name: Deploy production Pages app
        if: >-
          steps.next_release.outputs.release_needed == 'true' &&
          steps.deployment.outputs.pages_deployed != 'true'
        run: >-
          apps/api/node_modules/.bin/wrangler pages deploy "$GITHUB_WORKSPACE/apps/web/dist"
          --project-name=clarity-budget --branch=main
          --commit-hash="${{ github.event.workflow_run.head_sha }}"
          --commit-message="Release v${{ steps.next_release.outputs.version }}"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Checkpoint production Pages deployment
        if: >-
          steps.next_release.outputs.release_needed == 'true' &&
          steps.deployment.outputs.pages_deployed != 'true'
        run: node scripts/github-production-deployment.mjs stage pages
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Wait for production Pages propagation
        if: >-
          steps.next_release.outputs.release_needed == 'true' &&
          steps.deployment.outputs.skip_deploy != 'true'
        run: node scripts/wait-for-production-release.mjs
        env:
          EXPECTED_RELEASE_VERSION: ${{ steps.next_release.outputs.version }}
          WEB_URL: https://zoption.site
      - name: Verify production
        if: >-
          steps.next_release.outputs.release_needed == 'true' &&
          steps.deployment.outputs.skip_deploy != 'true'
        run: pnpm smoke:production
        env:
          WEB_URL: https://zoption.site
          API_URL: https://api.zoption.site
          EXPECTED_POSTHOG_HOST: https://us.i.posthog.com
      - name: Record successful production deployment
        if: >-
          steps.next_release.outputs.release_needed == 'true' &&
          steps.deployment.outputs.skip_deploy != 'true'
        run: node scripts/github-production-deployment.mjs finish success
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Record failed production deployment
        if: >-
          failure() &&
          steps.deployment.outputs.deployment_id != '' &&
          steps.deployment.outputs.skip_deploy != 'true'
        run: node scripts/github-production-deployment.mjs finish failure
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish semantic release
        if: steps.next_release.outputs.release_needed == 'true'
        run: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
