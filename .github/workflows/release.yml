name: Production Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  # Preflight is deliberately outside the production environment. It decides whether this CI
  # result is still main and whether it owes a release, and a superseded result fails at the
  # "Verify release source" guard below - before the gated job and its reviewer exist - so it
  # never asks anyone to approve a run that could only do nothing.
  preflight:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # semantic-release's dry run still performs a real "git push --dry-run" auth check before it
    # analyses a single commit, so the decision cannot run on a read only token: it fails with
    # EGITNOPERMISSION and no release is ever owed. This job never publishes, persist-credentials
    # is off, and the main ruleset refuses a push from github-actions[bot] regardless.
    permissions:
      contents: write
    outputs:
      release_needed: ${{ steps.next_release.outputs.release_needed }}
      version: ${{ steps.next_release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
          # Read-only job: it never leaves a push-capable credential in .git/config, and the
          # anonymous "git ls-remote" below works because this repository is public.
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Byte-identical to the guard in deploy-and-release, including the step name. The
      # duplication is deliberate - this copy stops that race before
      # the production environment gate, so the run never requests a reviewer, and the gated
      # copy re-checks currency after approval. scripts/release-workflow.test.mjs enforces both the
      # name and the byte-identity.
      - name: Verify release source
        env:
          RELEASE_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          remote_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$RELEASE_COMMIT" != "$remote_main" ]]; then
            echo "::error::Skipping stale CI result for $RELEASE_COMMIT; current main is $remote_main."
            exit 1
          fi
          if ! git tag --merged "$RELEASE_COMMIT" --list 'v[0-9]*' | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::No semantic-release baseline tag is reachable from $RELEASE_COMMIT. Create the documented one-time v2.2.1 tag before enabling releases."
            exit 1
          fi
      - name: Determine the next semantic release
        id: next_release
        run: node scripts/next-semantic-release.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Rehearses the release on the preview stack before anyone is asked to approve production: the
  # same migrations against the preview D1, the same Worker and both Pages builds, and the same
  # smoke gate with indexing expected off. It needs no approval because preview holds no real
  # user data, and production waits for it, so a migration or deploy that breaks fails here first.
  preview:
    needs: preflight
    if: needs.preflight.outputs.release_needed == 'true'
    concurrency:
      group: preview-release-main
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ZOPTION_DEPLOY_ENV: preview
      ZOPTION_RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Validate preview deployment configuration
        run: |
          node scripts/validate-deployment-config.mjs
          node scripts/export-deployment-env.mjs preview
      - uses: ./.github/actions/d1-restore-point
        with:
          environment: preview
      - name: Apply preview D1 migrations
        working-directory: apps/api
        run: ./node_modules/.bin/wrangler d1 migrations apply DB --remote --config wrangler.deploy.jsonc --env preview
      # No --strict: preview has no dashboard-only settings worth protecting, so the tracked
      # config always wins here.
      - name: Deploy preview Worker
        working-directory: apps/api
        run: >-
          ./node_modules/.bin/wrangler deploy --config wrangler.deploy.jsonc --env preview
          --tag "v${ZOPTION_RELEASE_VERSION}" --message "Preview of ${{ github.event.workflow_run.head_sha }}"
      # Preview builds omit PostHog, so the smoke gate expects no PostHog origin in the CSP.
      - name: Build and deploy preview web app
        env:
          CF_PAGES: "1"
        run: |
          pnpm --filter @zoption/web build
          apps/api/node_modules/.bin/wrangler pages deploy "$GITHUB_WORKSPACE/apps/web/dist" \
            --project-name=clarity-budget-preview --branch=main \
            --commit-hash="${{ github.event.workflow_run.head_sha }}" \
            --commit-message="Preview v${ZOPTION_RELEASE_VERSION}"
      - name: Build and deploy preview public site
        env:
          CF_PAGES: "1"
        run: |
          pnpm --filter @zoption/site build
          cd apps/site
          ../api/node_modules/.bin/wrangler pages deploy dist \
            --project-name=zoption-site-preview --branch=main \
            --commit-hash="${{ github.event.workflow_run.head_sha }}" \
            --commit-message="Preview v${ZOPTION_RELEASE_VERSION}"
      - name: Wait for preview propagation
        env:
          EXPECTED_RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          WEB_URL="$APP_URL" node scripts/wait-for-production-release.mjs
          WEB_URL="$SITE_URL" node scripts/wait-for-production-release.mjs
      - name: Verify preview
        run: pnpm smoke:production

  # A run parked at the production gate holds the deploy job's concurrency group, and nobody
  # approves a superseded one, so later releases would queue behind it indefinitely. Once this
  # run's preflight has confirmed it is current main, cancel older runs of another commit that are
  # still waiting for approval. It is its own job so the only actions: write token never sits
  # beside a dependency install, and so it lists after preflight, by which point an older run that
  # passed its own guard just before main moved has already reached the gate. A run approved
  # between the list and the cancel can still be cut off mid-deploy; the begin/resume deployment
  # checkpoints let the next release finish it.
  cancel-superseded:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Cancel superseded runs waiting for approval
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RELEASE_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh run list --workflow release.yml --status waiting --json databaseId,headSha \
            --jq ".[] | select(.databaseId < $RUN_ID and .headSha != \"$RELEASE_COMMIT\") | .databaseId" |
            while read -r id; do
              echo "Cancelling superseded run $id, which is waiting for production approval."
              gh run cancel "$id" || echo "::warning::Could not cancel run $id; it may have just been approved or finished."
            done

  # This job holds every production action: D1 migration, Worker and Pages deploys, and the
  # semantic-release publication. The production environment requires a reviewer, so a release
  # cannot reach production until a human approves the run. Keep "Prevent self-review" off; the
  # maintainer is the only human and acts on his own merges. Only a current CI result that owes
  # a release reaches this job; a newer run's cancel-superseded job cancels it if it is still
  # unapproved.
  # The concurrency group lives here, not on the workflow, so a run parked at this gate can never
  # stop a newer run's preflight from starting, while deploys still never overlap. It waits for
  # preview, so a release that fails there never asks for approval.
  deploy-and-release:
    needs: [preflight, preview]
    if: needs.preflight.outputs.release_needed == 'true'
    concurrency:
      group: production-release-main
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: write
      deployments: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
          # This job holds contents: write and runs install scripts, so it must not leave a
          # push-capable credential in .git/config. Publishing goes through the GitHub API with
          # GITHUB_TOKEN, and the anonymous "git ls-remote" in Verify release source works
          # because this repository is public.
          persist-credentials: false
      - uses: ./.github/actions/setup
      # First production step, after the same bootstrap as before: the CI result must still be
      # refs/heads/main at deploy time, checked here again even though preflight already checked
      # it, because approval happens between the two jobs.
      - name: Verify release source
        env:
          RELEASE_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          remote_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$RELEASE_COMMIT" != "$remote_main" ]]; then
            echo "::error::Skipping stale CI result for $RELEASE_COMMIT; current main is $remote_main."
            exit 1
          fi
          if ! git tag --merged "$RELEASE_COMMIT" --list 'v[0-9]*' | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::No semantic-release baseline tag is reachable from $RELEASE_COMMIT. Create the documented one-time v2.2.1 tag before enabling releases."
            exit 1
          fi
      - name: Verify deployment authority
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_GIT_DEPLOY_DISABLED: ${{ vars.CLOUDFLARE_PRODUCTION_GIT_DEPLOY_DISABLED }}
        run: |
          if [[ "$CLOUDFLARE_GIT_DEPLOY_DISABLED" != "true" ]]; then
            echo "::error::Disable Cloudflare's production Git deployment, then set CLOUDFLARE_PRODUCTION_GIT_DEPLOY_DISABLED=true."
            exit 1
          fi
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" || -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN are required."
            exit 1
          fi
      - name: Validate production deployment configuration
        run: |
          node scripts/validate-deployment-config.mjs
          node scripts/export-deployment-env.mjs production
          apps/api/node_modules/.bin/wrangler deploy --dry-run --outdir /tmp/zoption-worker-dist \
            --config apps/api/wrangler.deploy.jsonc --env production
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify the credential master key is a production Worker secret
        working-directory: apps/api
        run: |
          if ! secrets="$(./node_modules/.bin/wrangler secret list --config wrangler.deploy.jsonc --env production 2>&1)"; then
            echo "::error::Could not list production Worker secrets: $secrets"
            exit 1
          fi
          if ! grep -qE '"name"[[:space:]]*:[[:space:]]*"PROVIDER_CREDENTIAL_ENCRYPTION_KEY"' <<<"$secrets"; then
            echo "::error::PROVIDER_CREDENTIAL_ENCRYPTION_KEY is not set as a production Worker secret, so no provider credential can be saved or read. Store it with: openssl rand -base64 32 | pnpm --filter @zoption/api exec wrangler secret put PROVIDER_CREDENTIAL_ENCRYPTION_KEY --config wrangler.deploy.jsonc --env production"
            exit 1
          fi
          echo "PROVIDER_CREDENTIAL_ENCRYPTION_KEY is present on the production Worker."
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Start or resume the production deployment
        id: deployment
        run: node scripts/github-production-deployment.mjs begin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_COMMIT: ${{ github.event.workflow_run.head_sha }}
      - name: Record the production D1 restore point
        if: steps.deployment.outputs.worker_deployed != 'true'
        uses: ./.github/actions/d1-restore-point
        with:
          environment: production
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Apply production D1 migrations
        if: steps.deployment.outputs.worker_deployed != 'true'
        working-directory: apps/api
        run: ./node_modules/.bin/wrangler d1 migrations apply DB --remote --config wrangler.deploy.jsonc --env production
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy production Worker
        if: steps.deployment.outputs.worker_deployed != 'true'
        working-directory: apps/api
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # --strict aborts when the tracked config differs from what Cloudflare reports for the
          # deployed Worker. That stays the default, because an unplanned override should stop a
          # release. Set this repository variable to true only for a run that must write the
          # tracked config over the remote one, and unset it afterwards. The deploy job still sits
          # behind the production environment, so the override needs a human approval too.
          WORKER_CONFIG_OVERRIDE: ${{ vars.CLOUDFLARE_WORKER_CONFIG_OVERRIDE }}
        run: |
          set -euo pipefail
          args=(--config wrangler.deploy.jsonc --env production --strict)
          if [[ "${WORKER_CONFIG_OVERRIDE:-}" == "true" ]]; then
            echo "::warning::CLOUDFLARE_WORKER_CONFIG_OVERRIDE is true, deploying without --strict."
            args=(--config wrangler.deploy.jsonc --env production)
          fi
          ./node_modules/.bin/wrangler deploy "${args[@]}" \
            --tag "v${{ needs.preflight.outputs.version }}" \
            --message "GitHub Actions release ${{ github.event.workflow_run.head_sha }}"
      - name: Checkpoint production Worker deployment
        if: steps.deployment.outputs.worker_deployed != 'true'
        run: node scripts/github-production-deployment.mjs stage worker
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build versioned production web app
        if: steps.deployment.outputs.pages_deployed != 'true'
        run: pnpm --filter @zoption/web build
        env:
          CF_PAGES: "1"
          ZOPTION_DEPLOY_ENV: production
          ZOPTION_RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: https://us.i.posthog.com
      - name: Deploy production web app
        if: steps.deployment.outputs.pages_deployed != 'true'
        run: >-
          apps/api/node_modules/.bin/wrangler pages deploy "$GITHUB_WORKSPACE/apps/web/dist"
          --project-name=clarity-budget --branch=main
          --commit-hash="${{ github.event.workflow_run.head_sha }}"
          --commit-message="Release v${{ needs.preflight.outputs.version }}"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Checkpoint production web app deployment
        if: steps.deployment.outputs.pages_deployed != 'true'
        run: node scripts/github-production-deployment.mjs stage pages
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The public site reads the published reviews from the API deployed above, so it builds
      # after the Worker. It uses the same PostHog project key as the app.
      - name: Build versioned production public site
        if: steps.deployment.outputs.site_deployed != 'true'
        run: pnpm --filter @zoption/site build
        env:
          CF_PAGES: "1"
          ZOPTION_DEPLOY_ENV: production
          ZOPTION_RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          PUBLIC_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
      # Deployed from apps/site so wrangler compiles its functions/ directory (the /ingest proxy).
      - name: Deploy production public site
        if: steps.deployment.outputs.site_deployed != 'true'
        working-directory: apps/site
        run: >-
          ../api/node_modules/.bin/wrangler pages deploy dist
          --project-name=zoption-site --branch=main
          --commit-hash="${{ github.event.workflow_run.head_sha }}"
          --commit-message="Release v${{ needs.preflight.outputs.version }}"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Checkpoint production public site deployment
        if: steps.deployment.outputs.site_deployed != 'true'
        run: node scripts/github-production-deployment.mjs stage site
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Wait for production app propagation
        if: steps.deployment.outputs.skip_deploy != 'true'
        run: node scripts/wait-for-production-release.mjs
        env:
          EXPECTED_RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          WEB_URL: https://app.zoption.site
      - name: Wait for production public site propagation
        if: steps.deployment.outputs.skip_deploy != 'true'
        run: node scripts/wait-for-production-release.mjs
        env:
          EXPECTED_RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          WEB_URL: https://zoption.site
      - name: Verify production
        if: steps.deployment.outputs.skip_deploy != 'true'
        run: pnpm smoke:production
        env:
          SITE_URL: https://zoption.site
          APP_URL: https://app.zoption.site
          API_URL: https://api.zoption.site
          EXPECTED_POSTHOG_HOST: https://us.i.posthog.com
      # Best effort: a search-engine ping must never block or fail a release.
      - name: Submit URLs to IndexNow
        if: steps.deployment.outputs.skip_deploy != 'true'
        continue-on-error: true
        run: node scripts/submit-indexnow.mjs
      - name: Record successful production deployment
        if: steps.deployment.outputs.skip_deploy != 'true'
        run: node scripts/github-production-deployment.mjs finish success
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Record failed production deployment
        if: >-
          failure() &&
          steps.deployment.outputs.deployment_id != '' &&
          steps.deployment.outputs.skip_deploy != 'true'
        run: node scripts/github-production-deployment.mjs finish failure
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish semantic release
        run: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
