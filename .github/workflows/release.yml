name: Production Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# One human checkpoint: approving the production environment on deploy-and-release. Everything
# before it is automatic, and approval-summary writes what the approver needs to see (changes, bot
# authorship, migrations, CODEOWNERS paths, preview result, bundle hash) and announces the wait.
#
# contents: write is held by exactly two jobs. preflight needs it only because semantic-release's
# dry run authenticates a push; it publishes nothing. publish-release runs semantic-release after
# production is fully green. The Cloudflare token is read only by jobs in the preview or
# production environment (preview, deploy-and-release), never by a job outside one.
jobs:
  # Preflight is deliberately outside the production environment. It decides whether this CI
  # result is still main and whether it owes a release, and a superseded result fails at the
  # "Verify release source" guard below - before the gated job and its reviewer exist - so it
  # never asks anyone to approve a run that could only do nothing.
  preflight:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # semantic-release's dry run still performs a real "git push --dry-run" auth check before it
    # analyses a single commit, so the decision cannot run on a read only token: it fails with
    # EGITNOPERMISSION and no release is ever owed. This job never publishes, persist-credentials
    # is off, and the main ruleset refuses a push from github-actions[bot] regardless.
    permissions:
      contents: write
    outputs:
      release_needed: ${{ steps.next_release.outputs.release_needed }}
      version: ${{ steps.next_release.outputs.version }}
      previous_version: ${{ steps.previous_release.outputs.version }}
    steps:
      # Set the repository variable PRODUCTION_DEPLOY_FREEZE to true to hold every release (during an
      # incident, say) before any approval is requested; unset it to resume. Rollback ignores it.
      - name: Respect a production deploy freeze
        if: vars.PRODUCTION_DEPLOY_FREEZE == 'true'
        run: |
          echo "::error::PRODUCTION_DEPLOY_FREEZE is true, so no release starts. Unset it and rerun this workflow."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
          # Read-only job: it never leaves a push-capable credential in .git/config, and the
          # anonymous "git ls-remote" below works because this repository is public.
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Byte-identical to the guard in deploy-and-release, including the step name. The
      # duplication is deliberate - this copy stops that race before
      # the production environment gate, so the run never requests a reviewer, and the gated
      # copy re-checks currency after approval. scripts/release-workflow.test.mjs enforces both the
      # name and the byte-identity.
      - name: Verify release source
        env:
          RELEASE_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          remote_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$RELEASE_COMMIT" != "$remote_main" ]]; then
            echo "::error::Skipping stale CI result for $RELEASE_COMMIT; current main is $remote_main."
            exit 1
          fi
          if ! git tag --merged "$RELEASE_COMMIT" --list 'v[0-9]*' | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::No semantic-release baseline tag is reachable from $RELEASE_COMMIT. Create the documented one-time v2.2.1 tag before enabling releases."
            exit 1
          fi
      - name: Determine the next semantic release
        id: next_release
        run: node scripts/next-semantic-release.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The release production falls back to if this one fails after changing it.
      - name: Find the current release
        id: previous_release
        run: |
          tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${{ github.event.workflow_run.head_sha }}")"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  # Rehearses the release on the preview stack before anyone is asked to approve production: the
  # same migrations against the preview D1, the same Worker and both Pages builds, and the same
  # smoke gate with indexing expected off. It needs no approval because preview holds no real
  # user data, and production waits for it, so a migration or deploy that breaks fails here first.
  #
  # Preview and production are two builds on purpose, not an oversight to "fix" by promoting one
  # bundle. Vite bakes the environment into the bundle: VITE_API_URL, the Supabase URL and
  # publishable key, and the PostHog key (preview omits PostHog, and the CSP the build emits lists
  # a PostHog origin only when it is set). The same bytes cannot be correct for both. What is
  # promoted is the production build: build-production hashes it once before approval, attests
  # it, and the gated job deploys those exact bytes after re-verifying the hash.
  preview:
    needs: preflight
    if: needs.preflight.outputs.release_needed == 'true'
    # Holds the preview Cloudflare token; the environment has no required reviewer.
    environment: preview
    concurrency:
      group: preview-release-main
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # The signed-in audit adds about fifteen minutes to the deploy and smoke gate.
    timeout-minutes: 50
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ZOPTION_DEPLOY_ENV: preview
      ZOPTION_RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Validate preview deployment configuration
        run: |
          node scripts/validate-deployment-config.mjs
          node scripts/export-deployment-env.mjs preview
      - uses: ./.github/actions/d1-restore-point
        with:
          environment: preview
      - name: Apply preview D1 migrations
        working-directory: apps/api
        run: ./node_modules/.bin/wrangler d1 migrations apply DB --remote --config wrangler.deploy.jsonc --env preview
      # No --strict: preview has no dashboard-only settings worth protecting, so the tracked
      # config always wins here.
      - name: Deploy preview Worker
        working-directory: apps/api
        run: >-
          ./node_modules/.bin/wrangler deploy --config wrangler.deploy.jsonc --env preview
          --tag "v${ZOPTION_RELEASE_VERSION}" --message "Preview of ${{ github.event.workflow_run.head_sha }}"
      # Preview builds omit PostHog, so the smoke gate expects no PostHog origin in the CSP.
      - name: Build preview web app
        run: pnpm --filter @zoption/web build
        env:
          CF_PAGES: "1"
      - name: Deploy preview web app
        uses: ./.github/actions/pages-deploy
        with:
          project: clarity-budget-preview
          directory: apps/web/dist
          message: Preview v${{ needs.preflight.outputs.version }}
      - name: Build preview public site
        run: pnpm --filter @zoption/site build
        env:
          CF_PAGES: "1"
      - name: Deploy preview public site
        uses: ./.github/actions/pages-deploy
        with:
          project: zoption-site-preview
          working-directory: apps/site
          directory: dist
          message: Preview v${{ needs.preflight.outputs.version }}
      - name: Wait for preview propagation
        env:
          EXPECTED_RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          WEB_URL="$APP_URL" node scripts/wait-for-production-release.mjs
          WEB_URL="$SITE_URL" node scripts/wait-for-production-release.mjs
      - name: Verify preview
        run: pnpm smoke:production
      # The only place the signed-in pages are tested against a real Supabase. Pull request CI
      # has no session, so those specs skip there; here a failed sign-in fails the release.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Audit signed-in pages on preview
        run: pnpm test:e2e:preview
        env:
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_EMPTY_EMAIL: ${{ secrets.E2E_EMPTY_EMAIL }}
          E2E_EMPTY_PASSWORD: ${{ secrets.E2E_EMPTY_PASSWORD }}
      - name: Keep the Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Announce the failed preview
        if: failure()
        uses: ./.github/actions/notify
        with:
          text: "Zoption v${{ needs.preflight.outputs.version }} failed on preview, so production was not asked for approval. ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}

  # Builds the production app and public site once, before approval, so the gated job deploys
  # bytes that existed when the human approved and spends its time only on deploying. The site
  # reads the published reviews from the live production API here, so /api/reviews must keep its
  # response shape for one release (it fails the build rather than ship without them).
  build-production:
    needs: preflight
    if: needs.preflight.outputs.release_needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # id-token and attestations are only for signing the build's provenance below.
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      manifest_sha256: ${{ steps.manifest.outputs.sha256 }}
      attestation_url: ${{ steps.attest.outputs.attestation-url }}
    env:
      CF_PAGES: "1"
      ZOPTION_DEPLOY_ENV: production
      ZOPTION_RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: node scripts/export-deployment-env.mjs production
      - name: Build versioned production web app
        run: pnpm --filter @zoption/web build
        env:
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: https://us.i.posthog.com
      # Same PostHog project key as the app.
      - name: Build versioned production public site
        run: pnpm --filter @zoption/site build
        env:
          PUBLIC_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
      - name: Hash the build
        id: manifest
        working-directory: apps
        run: |
          set -euo pipefail
          find web/dist site/dist -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/manifest.sha256"
          echo "sha256=$(sha256sum "$RUNNER_TEMP/manifest.sha256" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      # Signed build provenance for every file in the bundle, from the manifest just hashed.
      - name: Attest the build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/manifest.sha256
      # A run can wait at the production gate for days, so the build outlives the default.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-dist
          path: |
            apps/web/dist
            apps/site/dist
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

  # Runs after preview and the production build and before the gate, so the summary is on the run
  # page when the approval request appears. It holds no write token and no Cloudflare token.
  # deploy-and-release needs it, so an approver is never asked without the summary. The Telegram
  # notice is best effort and skipped when the bot is not configured.
  approval-summary:
    needs: [preflight, preview, build-production]
    if: needs.preflight.outputs.release_needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Write the approval summary
        id: summary
        run: node scripts/release-summary.mjs
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          PREVIOUS_VERSION: ${{ needs.preflight.outputs.previous_version }}
          BUNDLE_SHA256: ${{ needs.build-production.outputs.manifest_sha256 }}
          ATTESTATION_URL: ${{ needs.build-production.outputs.attestation_url }}
          PREVIEW_RESULT: ${{ needs.preview.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - name: Announce the wait for approval
        uses: ./.github/actions/notify
        with:
          text: ${{ steps.summary.outputs.message }}
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}

  # A run parked at the production gate holds the deploy job's concurrency group, and nobody
  # approves a superseded one, so later releases would queue behind it indefinitely. Once this
  # run's preflight has confirmed it is current main, cancel older runs of another commit that are
  # still waiting for approval. It is its own job so the only actions: write token never sits
  # beside a dependency install, and so it lists after preflight, by which point an older run that
  # passed its own guard just before main moved has already reached the gate. A run approved
  # between the list and the cancel can still be cut off mid-deploy; the begin/resume deployment
  # checkpoints let the next release finish it.
  cancel-superseded:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Cancel superseded runs waiting for approval
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RELEASE_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh run list --workflow release.yml --status waiting --json databaseId,headSha \
            --jq ".[] | select(.databaseId < $RUN_ID and .headSha != \"$RELEASE_COMMIT\") | .databaseId" |
            while read -r id; do
              echo "Cancelling superseded run $id, which is waiting for production approval."
              gh run cancel "$id" || echo "::warning::Could not cancel run $id; it may have just been approved or finished."
            done

  # This job holds every production action: D1 migration and the Worker and Pages deploys. The
  # production environment requires a reviewer, so a release
  # cannot reach production until a human approves the run. Keep "Prevent self-review" off; the
  # maintainer is the only human and acts on his own merges. Only a current CI result that owes
  # a release reaches this job; a newer run's cancel-superseded job cancels it if it is still
  # unapproved.
  # The concurrency group lives here, not on the workflow, so a run parked at this gate can never
  # stop a newer run's preflight from starting, while deploys still never overlap. It waits for
  # preview, so a release that fails there never asks for approval.
  deploy-and-release:
    needs: [preflight, preview, build-production, approval-summary]
    if: needs.preflight.outputs.release_needed == 'true'
    # One production deploy at a time, shared with Production Rollback. A newer run waiting behind
    # a parked one replaces it (cancel-superseded and Cancel Superseded Releases cancel the old
    # one), so a batch of merges is approved once.
    concurrency:
      group: production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    # No contents: write: publishing the tag is publish-release's job, after this one is green.
    permissions:
      contents: read
      deployments: write
    outputs:
      skip_deploy: ${{ steps.deployment.outputs.skip_deploy }}
      low_sample: ${{ steps.canary.outputs.low_sample }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
          # This job holds contents: write and runs install scripts, so it must not leave a
          # push-capable credential in .git/config. Publishing goes through the GitHub API with
          # GITHUB_TOKEN, and the anonymous "git ls-remote" in Verify release source works
          # because this repository is public.
          persist-credentials: false
      - uses: ./.github/actions/setup
      # First production step, after the same bootstrap as before: the CI result must still be
      # refs/heads/main at deploy time, checked here again even though preflight already checked
      # it, because approval happens between the two jobs.
      - name: Verify release source
        env:
          RELEASE_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          remote_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$RELEASE_COMMIT" != "$remote_main" ]]; then
            echo "::error::Skipping stale CI result for $RELEASE_COMMIT; current main is $remote_main."
            exit 1
          fi
          if ! git tag --merged "$RELEASE_COMMIT" --list 'v[0-9]*' | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::No semantic-release baseline tag is reachable from $RELEASE_COMMIT. Create the documented one-time v2.2.1 tag before enabling releases."
            exit 1
          fi
      - name: Verify deployment authority
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_GIT_DEPLOY_DISABLED: ${{ vars.CLOUDFLARE_PRODUCTION_GIT_DEPLOY_DISABLED }}
        run: |
          if [[ "$CLOUDFLARE_GIT_DEPLOY_DISABLED" != "true" ]]; then
            echo "::error::Disable Cloudflare's production Git deployment, then set CLOUDFLARE_PRODUCTION_GIT_DEPLOY_DISABLED=true."
            exit 1
          fi
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" || -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN are required."
            exit 1
          fi
      - name: Validate production deployment configuration
        run: |
          node scripts/validate-deployment-config.mjs
          node scripts/export-deployment-env.mjs production
          apps/api/node_modules/.bin/wrangler deploy --dry-run --outdir /tmp/zoption-worker-dist \
            --config apps/api/wrangler.deploy.jsonc --env production
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify the credential master key is a production Worker secret
        working-directory: apps/api
        run: |
          if ! secrets="$(./node_modules/.bin/wrangler secret list --config wrangler.deploy.jsonc --env production 2>&1)"; then
            echo "::error::Could not list production Worker secrets: $secrets"
            exit 1
          fi
          if ! grep -qE '"name"[[:space:]]*:[[:space:]]*"PROVIDER_CREDENTIAL_ENCRYPTION_KEY"' <<<"$secrets"; then
            echo "::error::PROVIDER_CREDENTIAL_ENCRYPTION_KEY is not set as a production Worker secret, so no provider credential can be saved or read. Store it with: openssl rand -base64 32 | pnpm --filter @zoption/api exec wrangler secret put PROVIDER_CREDENTIAL_ENCRYPTION_KEY --config wrangler.deploy.jsonc --env production"
            exit 1
          fi
          echo "PROVIDER_CREDENTIAL_ENCRYPTION_KEY is present on the production Worker."
          # Not fatal: a missing dispatch token stalls bug report drafting, not the app.
          if ! grep -qE '"name"[[:space:]]*:[[:space:]]*"GITHUB_BUGFIX_DISPATCH_TOKEN"' <<<"$secrets"; then
            echo "::warning::GITHUB_BUGFIX_DISPATCH_TOKEN is not set on the production Worker, so no bug report is drafted. See the bugfix automation section of docs/deployment.md."
          fi
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Start or resume the production deployment
        id: deployment
        run: node scripts/github-production-deployment.mjs begin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_COMMIT: ${{ github.event.workflow_run.head_sha }}
      - name: Plan the production Worker rollout
        id: rollout
        if: steps.deployment.outputs.worker_deployed != 'true'
        run: node scripts/worker-canary.mjs plan
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Record the production D1 restore point
        if: steps.deployment.outputs.worker_deployed != 'true'
        uses: ./.github/actions/d1-restore-point
        with:
          environment: production
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Apply production D1 migrations
        if: steps.deployment.outputs.worker_deployed != 'true'
        working-directory: apps/api
        run: ./node_modules/.bin/wrangler d1 migrations apply DB --remote --config wrangler.deploy.jsonc --env production
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # The new Worker version takes traffic in stages: 0% while version-pinned probes check it,
      # then CANARY_PERCENTAGE while it soaks, then 100%. --strict aborts when the tracked config
      # differs from what Cloudflare reports for the deployed Worker. That stays the default,
      # because an unplanned override should stop a release. Set CLOUDFLARE_WORKER_CONFIG_OVERRIDE
      # to true only for a run that must write the tracked config over the remote one, and unset it
      # afterwards; it still needs the production approval.
      - name: Upload production Worker version
        id: worker
        if: steps.deployment.outputs.worker_deployed != 'true'
        working-directory: apps/api
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WORKER_CONFIG_OVERRIDE: ${{ vars.CLOUDFLARE_WORKER_CONFIG_OVERRIDE }}
          STRATEGY: ${{ steps.rollout.outputs.strategy }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-worker.ndjson
        run: |
          set -euo pipefail
          args=(--config wrangler.deploy.jsonc --env production --strict)
          if [[ "${WORKER_CONFIG_OVERRIDE:-}" == "true" ]]; then
            echo "::warning::CLOUDFLARE_WORKER_CONFIG_OVERRIDE is true, deploying without --strict."
            args=(--config wrangler.deploy.jsonc --env production)
          fi
          args+=(--tag "v${{ needs.preflight.outputs.version }}"
            --message "GitHub Actions release ${{ github.event.workflow_run.head_sha }}")
          # Durable Object migrations and queue consumer changes apply only through a full deploy.
          if [[ "$STRATEGY" == "atomic" ]]; then
            echo "::warning::This release changes settings a gradual rollout cannot apply; deploying to 100% at once."
            ./node_modules/.bin/wrangler deploy "${args[@]}"
            echo "version_id=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ./node_modules/.bin/wrangler versions upload "${args[@]}"
          version_id="$(jq -r 'select(.type == "version-upload") | .version_id' "$WRANGLER_OUTPUT_FILE_PATH" | tail -n 1)"
          if [[ -z "$version_id" || "$version_id" == "null" ]]; then
            echo "::error::wrangler versions upload reported no version ID."
            exit 1
          fi
          echo "version_id=$version_id" >> "$GITHUB_OUTPUT"
      # The soak length and thresholds are repository variables, so they change without a code
      # change: CANARY_DWELL_MINUTES (default 10), CANARY_MAX_EXTRA_ERROR_POINTS (how many
      # percentage points above the old version's error rate the new one may run, default 1), and
      # CANARY_MIN_REQUESTS (requests to the new version needed to judge a rate, default 50). Below
      # the minimum the release is promoted on the probes alone, with a warning in the summary and
      # the announcement. Analytics that cannot be queried fail the step, which rolls back.
      - name: Canary the new Worker version
        id: canary
        if: steps.deployment.outputs.worker_deployed != 'true' && steps.worker.outputs.version_id != ''
        working-directory: apps/api
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NEW_VERSION: ${{ steps.worker.outputs.version_id }}
          PREVIOUS_VERSION: ${{ steps.rollout.outputs.previous_version }}
          CANARY_PERCENTAGE: 10
          CANARY_DWELL_MINUTES: ${{ vars.CANARY_DWELL_MINUTES }}
          CANARY_MAX_EXTRA_ERROR_POINTS: ${{ vars.CANARY_MAX_EXTRA_ERROR_POINTS }}
          CANARY_MIN_REQUESTS: ${{ vars.CANARY_MIN_REQUESTS }}
        run: |
          set -euo pipefail
          deploy() {
            ./node_modules/.bin/wrangler versions deploy "$@" --yes \
              --config wrangler.deploy.jsonc --env production \
              --message "Canary v${{ needs.preflight.outputs.version }}"
          }
          deploy "$NEW_VERSION@0" "$PREVIOUS_VERSION@100"
          node ../../scripts/worker-canary.mjs probe
          deploy "$NEW_VERSION@$CANARY_PERCENTAGE" "$PREVIOUS_VERSION@$((100 - CANARY_PERCENTAGE))"
          node ../../scripts/worker-canary.mjs soak
          deploy "$NEW_VERSION@100"
          # versions upload leaves routes, the custom domain, and cron triggers alone.
          ./node_modules/.bin/wrangler triggers deploy --config wrangler.deploy.jsonc --env production
      - name: Checkpoint production Worker deployment
        if: steps.deployment.outputs.worker_deployed != 'true'
        run: node scripts/github-production-deployment.mjs stage worker
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The app and site were built before approval by build-production. Deploy exactly those
      # bytes: the manifest must match the hash that job reported, file for file.
      - name: Fetch the approved production build
        if: steps.deployment.outputs.pages_deployed != 'true' || steps.deployment.outputs.site_deployed != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: production-dist
          path: apps
      - name: Verify the production build is unchanged
        if: steps.deployment.outputs.pages_deployed != 'true' || steps.deployment.outputs.site_deployed != 'true'
        working-directory: apps
        env:
          EXPECTED_MANIFEST_SHA256: ${{ needs.build-production.outputs.manifest_sha256 }}
        run: |
          set -euo pipefail
          find web/dist site/dist -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/manifest.sha256"
          actual="$(sha256sum "$RUNNER_TEMP/manifest.sha256" | cut -d' ' -f1)"
          if [[ "$actual" != "$EXPECTED_MANIFEST_SHA256" ]]; then
            echo "::error::The downloaded build does not match the one built before approval."
            exit 1
          fi
          echo "Deploying the build approved as $actual."
      - name: Deploy production web app
        if: steps.deployment.outputs.pages_deployed != 'true'
        uses: ./.github/actions/pages-deploy
        with:
          project: clarity-budget
          directory: apps/web/dist
          message: Release v${{ needs.preflight.outputs.version }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Checkpoint production web app deployment
        if: steps.deployment.outputs.pages_deployed != 'true'
        run: node scripts/github-production-deployment.mjs stage pages
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Deployed from apps/site so wrangler compiles its functions/ directory (the /ingest proxy).
      - name: Deploy production public site
        if: steps.deployment.outputs.site_deployed != 'true'
        uses: ./.github/actions/pages-deploy
        with:
          project: zoption-site
          working-directory: apps/site
          directory: dist
          message: Release v${{ needs.preflight.outputs.version }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Checkpoint production public site deployment
        if: steps.deployment.outputs.site_deployed != 'true'
        run: node scripts/github-production-deployment.mjs stage site
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Wait for production app propagation
        if: steps.deployment.outputs.skip_deploy != 'true'
        run: node scripts/wait-for-production-release.mjs
        env:
          EXPECTED_RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          WEB_URL: https://app.zoption.site
      - name: Wait for production public site propagation
        if: steps.deployment.outputs.skip_deploy != 'true'
        run: node scripts/wait-for-production-release.mjs
        env:
          EXPECTED_RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          WEB_URL: https://zoption.site
      - name: Verify production
        if: steps.deployment.outputs.skip_deploy != 'true'
        run: pnpm smoke:production
        env:
          SITE_URL: https://zoption.site
          APP_URL: https://app.zoption.site
          API_URL: https://api.zoption.site
          EXPECTED_POSTHOG_HOST: https://us.i.posthog.com
      # Any failure once this run has touched the Worker puts production back on the previous
      # release, Pages included, so a broken release never waits for a human to notice. Crossing
      # this release's migrations is safe by the expand-then-contract rule: each must work with the
      # Worker one release back. Data is never rolled back; the D1 restore point is in the summary.
      - name: Roll production back to the previous release
        id: auto_rollback
        if: >-
          failure() &&
          steps.deployment.outputs.skip_deploy != 'true' &&
          (steps.worker.outcome != 'skipped' || steps.deployment.outputs.worker_deployed == 'true')
        uses: ./.github/actions/rollback-production
        with:
          version: ${{ needs.preflight.outputs.previous_version }}
          reason: Release v${{ needs.preflight.outputs.version }} failed its checks
          allow-newer-migrations: "true"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Void the deployment checkpoints after the rollback
        if: failure() && steps.auto_rollback.outcome == 'success'
        run: node scripts/github-production-deployment.mjs stage rollback
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Best effort: a search-engine ping must never block or fail a release.
      - name: Submit URLs to IndexNow
        if: steps.deployment.outputs.skip_deploy != 'true'
        continue-on-error: true
        run: node scripts/submit-indexnow.mjs
      - name: Record successful production deployment
        if: steps.deployment.outputs.skip_deploy != 'true'
        run: node scripts/github-production-deployment.mjs finish success
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Record failed production deployment
        if: >-
          failure() &&
          steps.deployment.outputs.deployment_id != '' &&
          steps.deployment.outputs.skip_deploy != 'true'
        run: node scripts/github-production-deployment.mjs finish failure
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Announce the failed release
        if: failure()
        uses: ./.github/actions/notify
        with:
          text: >-
            Zoption v${{ needs.preflight.outputs.version }} failed in production.
            ${{ steps.auto_rollback.outcome == 'success' && format('Production is back on v{0}.', needs.preflight.outputs.previous_version) || (steps.auto_rollback.outcome == 'failure' && 'The automatic rollback failed; production needs attention now.' || 'Production was not changed.') }}
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}

  # The only job besides preflight with contents: write, and it runs only once production is fully
  # green: deployed, propagated, smoke-tested, and recorded. It holds no Cloudflare token and sits
  # in no environment, so there is no second approval. semantic-release refuses to publish when
  # main has moved past the release commit, as before.
  publish-release:
    needs: [preflight, deploy-and-release]
    if: needs.deploy-and-release.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
          # Publishing goes through the GitHub API and semantic-release's own token handling; no
          # push-capable credential is left in .git/config.
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Publish semantic release
        run: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Announce the release
        if: success() && needs.deploy-and-release.outputs.skip_deploy != 'true'
        uses: ./.github/actions/notify
        with:
          text: >-
            Zoption v${{ needs.preflight.outputs.version }} is live.
            ${{ needs.deploy-and-release.outputs.low_sample == 'true' && 'Warning: the canary was promoted on probes alone because too little traffic reached the new version to judge its error rate.' || '' }}
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Announce the failed publication
        if: failure()
        uses: ./.github/actions/notify
        with:
          text: "Zoption v${{ needs.preflight.outputs.version }} is deployed but publishing the release tag failed. ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
