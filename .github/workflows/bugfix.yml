name: Bugfix Draft

# The draft job reads user text and holds the model key, so it runs on a read only token and
# cannot push anywhere. The open-pr job holds the write token, runs no model, and reads no user
# text. An artifact sits between them, and that artifact is also the shadow mode deliverable.
on:
  # The schedule claims at most one report per tick, so one tick is at most one coding agent run.
  schedule:
    - cron: "*/15 * * * *"
  # A manual run without an id claims the next report, the same as a tick, so it still works when
  # GitHub delays or drops the schedule. With an id it drafts that report, including one a failed
  # run already claimed.
  workflow_dispatch:
    inputs:
      bug_report_id:
        description: "Bug report id to draft; leave empty to claim the next report"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: bugfix-${{ inputs.bug_report_id || github.run_id }}
  cancel-in-progress: false

jobs:
  claim:
    name: Claim a report
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      id: ${{ steps.pick.outputs.id }}
    steps:
      - id: pick
        env:
          OPS_API_BASE_URL: ${{ vars.OPS_API_BASE_URL || 'https://api.zoption.site' }}
          OPS_EGRESS_TOKEN: ${{ secrets.OPS_EGRESS_TOKEN }}
          BUG_REPORT_ID: ${{ inputs.bug_report_id }}
        run: |
          set -euo pipefail
          id="${BUG_REPORT_ID}"
          if [ -z "${id}" ]; then
            # Reading the list claims what it returns. Claiming inside the run that drafts is what
            # keeps a claimed report from being lost between the poll and the draft.
            curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer ${OPS_EGRESS_TOKEN}" \
              "${OPS_API_BASE_URL}/api/ops/bug-reports?limit=1" > claimed.json
            id="$(jq -r '.reports[0].id // empty' claimed.json)"
            jq -c '.counts' claimed.json
            rm claimed.json
          fi
          # The id becomes a branch name and a shell value, so only a plain identifier passes.
          if [ -n "${id}" ] && ! [[ "${id}" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo "::error::Refusing a malformed report id"
            exit 1
          fi
          echo "id=${id}" >> "${GITHUB_OUTPUT}"

  draft:
    name: Draft the fix
    needs: claim
    if: needs.claim.outputs.id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The content freshness tests date each page from git history, so a shallow clone
          # fails several web tests that have nothing to do with the draft. ci.yml fetches the
          # same way for the same reason.
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Fetch the scrubbed report
        env:
          OPS_API_BASE_URL: ${{ vars.OPS_API_BASE_URL || 'https://api.zoption.site' }}
          OPS_EGRESS_TOKEN: ${{ secrets.OPS_EGRESS_TOKEN }}
          BUG_REPORT_ID: ${{ needs.claim.outputs.id }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${OPS_EGRESS_TOKEN}" \
            "${OPS_API_BASE_URL}/api/ops/bug-reports?id=${BUG_REPORT_ID}" > report.json

          # A blocked report is never drafted, and neither is an id the endpoint does not know.
          if [ "$(jq '.reports | length' report.json)" != "1" ]; then
            echo "::error::Report ${BUG_REPORT_ID} is not available for drafting"
            jq -c '{counts, blocked}' report.json >&2
            exit 1
          fi

          # The agent works inside the checkout, so the report has to be readable from there.
          jq -r '.reports[0].text' report.json > .bugfix-report.txt
          head -n 1 .bugfix-report.txt | cut -c1-90 > .bugfix-title.txt
          rm report.json

      - name: Draft the fix with dsh
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail
          # Pinned because this step holds the model key, and to rc.3 specifically: rc.1 and rc.2,
          # which is npm's latest, both fail to resolve @deepseek-ai/dsh-sandbox-local, so the
          # headless profile never loads its plugin tree and every run dies before drafting.
          npm install --global @deepseek-ai/dsh@0.1.5-rc.3
          task="$(cat <<'TASK'
          A user filed the bug report in .bugfix-report.txt. Identifiers and amounts in it are
          already replaced with [REDACTED]; do not try to recover them.

          Fix the underlying bug in this repository:
          - Follow the conventions in AGENTS.md and in the nearest nested AGENTS.md.
          - Reproduce the problem, find the root cause, and make the smallest change that fixes it.
          - Add or update a focused test, run it with pnpm vitest run <paths>, and make it pass.
            Do not run the end to end suite.
          - Write the pull request body to .bugfix-pr-body.md in the repository root. Keep it
            short: what broke, the root cause, what changed, how you verified it. Never quote the
            report text.
          - Do not create a branch, commit, push, or open a pull request.
          TASK
          )"
          dsh --profile headless "$task"

      - name: Collect the draft
        env:
          BUG_REPORT_ID: ${{ needs.claim.outputs.id }}
        run: |
          set -euo pipefail
          if [ ! -f .bugfix-pr-body.md ]; then
            echo "::error::The agent did not write .bugfix-pr-body.md"
            exit 1
          fi

          mkdir -p bugfix-artifact
          mv .bugfix-pr-body.md bugfix-artifact/pr-body.md
          report_title="$(cat .bugfix-title.txt)"
          # Neither scratch file belongs in the draft.
          rm -f .bugfix-report.txt .bugfix-title.txt

          git add --all
          git diff --cached --binary > bugfix-artifact/fix.patch
          if [ ! -s bugfix-artifact/fix.patch ]; then
            echo "::error::The agent produced no changes"
            exit 1
          fi
          git diff --cached --stat

          jq -n --arg id "${BUG_REPORT_ID}" --arg title "${report_title}" \
            --arg sha "$(sha256sum bugfix-artifact/fix.patch | cut -d' ' -f1)" \
            '{bugReportId: $id, title: $title, patchSha256: $sha}' > bugfix-artifact/meta.json

      # Fail closed: the upload is the last step, so an artifact only exists for a draft that
      # passed. The open-pr job therefore never applies a patch this check rejected.
      - name: Check the draft for leaked identifiers
        # meta.json carries the report title, which reaches the pull request title unchecked.
        run: node scripts/bugfix-scrub.mjs bugfix-artifact/fix.patch bugfix-artifact/pr-body.md bugfix-artifact/meta.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bugfix-draft
          path: bugfix-artifact
          if-no-files-found: error

  open-pr:
    name: Open the draft pull request
    needs: draft
    # Shadow mode: with this repository variable unset the draft stays an artifact you read.
    if: vars.OPEN_BUGFIX_PRS == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: write
    outputs:
      url: ${{ steps.open.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bugfix-draft
          path: bugfix-artifact

      - name: Verify the draft is the one the scrubber saw
        run: |
          set -euo pipefail
          cd bugfix-artifact
          echo "$(jq -r .patchSha256 meta.json)  fix.patch" | sha256sum --check --strict

      - name: Refuse a draft that changes the automation itself
        run: |
          set -euo pipefail
          # The paths come from the patch itself. Grepping the diff text misses a binary file,
          # which has no --- or +++ line, and a pure rename, which has no hunk at all. -z keeps a
          # path verbatim that git would otherwise quote.
          changed="$(git apply --numstat -z bugfix-artifact/fix.patch | tr '\000' '\n' | cut -f3 | sort -u)"
          # A -diff attribute in .gitattributes makes git treat a file as binary, which hides the
          # change from the human reading the pull request.
          blocked="$(printf '%s\n' "${changed}" | grep -E '^(\.github/|scripts/)|(^|/)(pnpm-lock\.yaml|release\.config\.mjs|\.gitattributes)$' || true)"
          if [ -n "${blocked}" ]; then
            echo "::error::This draft changes files the automation may not change"
            printf '%s\n' "${blocked}"
            exit 1
          fi

      - name: Open the draft pull request
        id: open
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          report_id="$(jq -r .bugReportId bugfix-artifact/meta.json)"
          title="$(jq -r .title bugfix-artifact/meta.json)"
          if [ -z "${title}" ] || [ "${title}" = "null" ]; then
            title="bug report ${report_id}"
          fi
          branch="bugfix/${report_id}"

          git apply --check bugfix-artifact/fix.patch
          git apply bugfix-artifact/fix.patch
          git switch --create "${branch}"
          git add --all
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit --message "fix: draft a fix for bug report ${report_id}"

          # The run token is the only credential in this job, and it cannot reach main.
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --set-upstream origin "${branch}"

          url="$(gh pr create --draft --title "fix: ${title}" \
            --body-file bugfix-artifact/pr-body.md --head "${branch}")"
          echo "url=${url}" >> "${GITHUB_OUTPUT}"

          # A pull request opened with the run token does not trigger pull_request workflows, so
          # start CI explicitly. workflow_dispatch is the documented exception to that rule.
          gh workflow run ci.yml --ref "${branch}"

  notify:
    name: Notify on Telegram
    needs: [claim, draft, open-pr]
    # Only a run that claimed a report has anything to say. A tick with an empty queue stays quiet.
    if: always() && needs.claim.outputs.id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPORT_ID: ${{ needs.claim.outputs.id }}
          CLAIM_RESULT: ${{ needs.claim.result }}
          DRAFT_RESULT: ${{ needs.draft.result }}
          OPEN_PR_RESULT: ${{ needs.open-pr.result }}
          PR_URL: ${{ needs.open-pr.outputs.url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${TELEGRAM_BOT_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then
            echo "::notice::Telegram is not configured, so no message was sent"
            exit 0
          fi

          # Telegram is a third party, so the message carries links and status, never report text.
          if [ "${OPEN_PR_RESULT}" = "success" ]; then
            text="Bug report ${REPORT_ID}: draft pull request ready for your review
          ${PR_URL}"
          elif [ "${DRAFT_RESULT}" = "success" ] && [ "${OPEN_PR_RESULT}" = "skipped" ]; then
            text="Bug report ${REPORT_ID}: shadow mode draft ready as a run artifact
          ${RUN_URL}"
          else
            text="Bug report ${REPORT_ID}: automation failed (claim ${CLAIM_RESULT}, draft ${DRAFT_RESULT}, open-pr ${OPEN_PR_RESULT}). Rerun by id once fixed.
          ${RUN_URL}"
          fi

          curl --fail --silent --show-error --output /dev/null \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${text}" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"
