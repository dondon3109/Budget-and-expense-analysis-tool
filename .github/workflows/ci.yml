name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Build shared package and API
        run: pnpm --filter @zoption/shared build && pnpm --filter @zoption/api build
      - name: Build preview web app
        run: pnpm --filter @zoption/web build
        env:
          CF_PAGES: "1"
          ZOPTION_DEPLOY_ENV: preview
          VITE_API_URL: https://api-preview.example.invalid
          VITE_SUPABASE_URL: https://ci-dummy.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_dummy
      - name: Build production web app
        run: pnpm --filter @zoption/web build
        env:
          CF_PAGES: "1"
          ZOPTION_DEPLOY_ENV: production
          VITE_API_URL: https://api.zoption.site
          VITE_SUPABASE_URL: https://ci-dummy.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_dummy
      - run: pnpm lighthouse
