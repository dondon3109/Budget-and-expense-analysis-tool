name: CI

on:
  push:
    branches: [main]
  # ready_for_review reruns CI (and dependency-review) when the maintainer marks a bugfix draft
  # ready, the click that also arms auto-merge, so the review of its dependencies is fresh.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # A pull request the bugfix automation opens uses the run token, which does not trigger
  # pull_request workflows. workflow_dispatch is the documented exception, so that workflow
  # starts this one explicitly on the draft branch.
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request makes its running CI worthless, so cancel it. Pushes to main never
# cancel: each finished main run is what Production Release keys off.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The jobs run in parallel and share no state; the Production Release workflow waits for the
# whole CI run, so a failure in any job still blocks a release. static, unit, e2e,
# dependency-review, and codeql are the required checks of the main CI gate ruleset.
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # wrangler and the rest of the deploy toolchain are devDependencies, so the production
      # audit alone does not cover the tools that run with the Cloudflare token.
      - run: pnpm audit --prod --audit-level high
      - run: pnpm audit --dev --audit-level high
      # Lint needs more than the default heap: the type-aware config exceeds it, so the
      # setting lives in the command here exactly as it does in the root verify script.
      - run: NODE_OPTIONS=--max-old-space-size=8192 pnpm lint
      - run: pnpm format:check
      # File size ceilings and one-line mobile routes (scripts/check-structure.mjs).
      - run: node scripts/check-structure.mjs
      - run: pnpm typecheck
      # Workflow syntax, expressions, and their shell (shellcheck ships on the runner). The binary
      # is pinned by version and checksum because this job runs on every pull request.
      - name: Lint workflows
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The content freshness guard dates each page from git history
          # (apps/web and apps/site content-freshness tests), so it needs the full log
          # rather than the default single commit.
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm test
      - run: pnpm test:mobile

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # The builds run before the end to end suite so the published sitemap exists
      # for e2e/public-content-routes.spec.ts, which otherwise skips in CI.
      - name: Build shared package and API
        run: pnpm --filter @zoption/shared build && pnpm --filter @zoption/api build
      - name: Build preview web app
        run: pnpm --filter @zoption/web build
        env:
          CF_PAGES: "1"
          ZOPTION_DEPLOY_ENV: preview
          VITE_API_URL: https://api-preview.example.invalid
          VITE_SUPABASE_URL: https://ci-dummy.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_dummy
      - name: Build production web app
        run: pnpm --filter @zoption/web build
        env:
          CF_PAGES: "1"
          ZOPTION_DEPLOY_ENV: production
          VITE_API_URL: https://api.zoption.site
          VITE_SUPABASE_URL: https://ci-dummy.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_dummy
          VITE_POSTHOG_KEY: phc_ci_dummy
          VITE_POSTHOG_HOST: https://us.i.posthog.com
      # Neither site build sets CF_PAGES, so neither needs the live API for reviews or a PostHog key.
      - name: Build preview public site
        run: pnpm --filter @zoption/site build
        env:
          ZOPTION_DEPLOY_ENV: preview
          PUBLIC_API_URL: https://api-preview.example.invalid
          PUBLIC_APP_URL: https://app-preview.example.invalid
      - name: Build production public site
        run: pnpm --filter @zoption/site build
        env:
          ZOPTION_DEPLOY_ENV: production
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm lighthouse
      # Traces and screenshots are the only way to debug a CI-only e2e failure.
      - name: Keep the Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
          if-no-files-found: ignore

  # Fails on a newly added dependency with a high severity advisory, and runs on every pull
  # request and every dispatched bugfix run, so a bot pull request that changes package.json or
  # the lockfile can never reach the gate without it: a required check that is skipped counts as
  # passing. Only a push to main skips it, where the pull request already passed.
  dependency-review:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # No comment: it would need pull-requests: write, which this job does not hold.
          comment-summary-in-pr: never
          # A dispatched run has no pull request to compare, so it compares its branch with main.
          base-ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || '' }}
          head-ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || '' }}

  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:javascript-typescript
