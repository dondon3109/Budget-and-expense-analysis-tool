name: Production Monitor

# Runs the read-only production smoke gate every 10 minutes, outside any release. Two failures a
# minute apart open one `production-down` issue assigned to the repository owner, which is what
# notifies them, along with a Telegram message; later failures comment on it, and the next pass
# closes it with another message. GitHub delays scheduled runs under load and disables them after
# 60 days without repository activity.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: production-monitor
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: node scripts/export-deployment-env.mjs production
      # A deploy in flight or a transient edge error can fail one pass, so only a repeat counts.
      # The Android Beta channel is checked with production: a bad latest.json or a missing APK
      # breaks in-app updates and the install page for every user, with no deploy involved.
      - name: Check production
        id: check
        env:
          EXPECTED_POSTHOG_HOST: https://us.i.posthog.com
        run: |
          check() {
            pnpm smoke:production && node --experimental-strip-types scripts/android-channel-check.mjs
          }
          if check > "$RUNNER_TEMP/smoke.log" 2>&1; then
            echo "healthy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sleep 60
          if check > "$RUNNER_TEMP/smoke.log" 2>&1; then
            echo "healthy=true" >> "$GITHUB_OUTPUT"
          else
            echo "healthy=false" >> "$GITHUB_OUTPUT"
            cat "$RUNNER_TEMP/smoke.log"
          fi
      - name: Report the result
        id: report
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEALTHY: ${{ steps.check.outputs.healthy }}
          OWNER: ${{ github.repository_owner }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          open="$(gh issue list --label production-down --state open --json number --jq '.[0].number // empty')"
          if [[ "$HEALTHY" == "true" ]]; then
            if [[ -n "$open" ]]; then
              gh issue close "$open" --comment "Production passes the smoke checks again ($RUN_URL)."
              echo "message=Zoption production passes its smoke checks again. $RUN_URL" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          failure="$(grep -m1 -E 'Error|error' "$RUNNER_TEMP/smoke.log" || tail -n 1 "$RUNNER_TEMP/smoke.log")"
          if [[ -n "$open" ]]; then
            gh issue comment "$open" --body "Still failing: \`${failure}\` ($RUN_URL)"
          else
            gh label create production-down --color B60205 \
              --description "Production failed the scheduled smoke checks" 2>/dev/null || true
            gh issue create --label production-down --assignee "$OWNER" \
              --title "Production is failing its smoke checks" \
              --body "The scheduled Production Monitor failed twice a minute apart: \`${failure}\`

          Run: $RUN_URL

          Check the latest Production Release run, then roll back with the Production Rollback workflow if a release caused it (docs/deployment.md#rollback). This issue closes itself on the next passing check."
            echo "message=Zoption production is failing its smoke checks. $RUN_URL" >> "$GITHUB_OUTPUT"
          fi
          exit 1
      # Only the start and the end of an outage notify; the issue holds everything in between.
      - name: Notify about the change
        if: always() && steps.report.outputs.message != ''
        uses: ./.github/actions/notify
        with:
          text: ${{ steps.report.outputs.message }}
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
