name: Android Play Bundle

# Builds the Google Play distribution (ZOPTION_DISTRIBUTION=play) as a release
# Android App Bundle signed with the Play upload key, verifies it, and keeps it
# as a workflow artifact for a manual upload in Play Console. It never uploads
# to Play, publishes to R2, or commits. The version is whatever the last
# release bump set (apps/mobile/package.json and android.versionCode), so build
# from the released commit. Setup: docs/mobile/build-instructions.md.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit, tag, or branch to build (empty builds the dispatched ref)"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: android-play-bundle
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify upload-signed release AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APP_VARIANT: production
      ZOPTION_DISTRIBUTION: play
      # The website APK's permanent key. Play App Signing re-signs installs with
      # the app signing key, so the bundle itself must carry the separate upload key.
      SIDELOAD_FINGERPRINT: F9:46:70:EB:94:11:F3:DA:68:3A:13:33:DD:7F:6C:69:58:B0:08:3C:CE:C4:7E:75:89:4C:38:DB:C6:A5:A5:8D
      BUNDLETOOL_VERSION: 1.18.3
      BUNDLETOOL_SHA256: a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: ./.github/actions/setup

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17

      - name: Check Play upload key secrets
        env:
          PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          PLAY_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEYSTORE_PASSWORD }}
          PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          for name in PLAY_UPLOAD_KEYSTORE_BASE64 PLAY_UPLOAD_KEYSTORE_PASSWORD PLAY_UPLOAD_KEY_ALIAS PLAY_UPLOAD_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::The $name secret is not set."; exit 1
            fi
          done

      # Same validated public production configuration as the APK build.
      - name: Export production public configuration
        run: node scripts/export-deployment-env.mjs production

      - name: Validate mobile crash telemetry configuration
        run: node scripts/validate-mobile-telemetry-env.mjs
        env:
          EXPO_PUBLIC_POSTHOG_KEY: ${{ secrets.EXPO_PUBLIC_POSTHOG_KEY }}
          EXPO_PUBLIC_POSTHOG_HOST: ${{ vars.EXPO_PUBLIC_POSTHOG_HOST }}
          EXPO_PUBLIC_TELEMETRY_DISABLED: ${{ vars.EXPO_PUBLIC_TELEMETRY_DISABLED }}

      - name: Install PostHog CLI for source map upload
        env:
          POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
        run: |
          if [ -z "$POSTHOG_CLI_API_KEY" ]; then
            echo "::notice::POSTHOG_CLI_API_KEY is not set; crash frames stay minified."
            exit 0
          fi
          npm install -g @posthog/cli@0.18.10
          echo "POSTHOG_UPLOAD_SOURCE_MAPS=1" >> "$GITHUB_ENV"

      - name: Resolve Android release identity
        working-directory: apps/mobile
        run: |
          pnpm exec expo config --type introspect --json > "$RUNNER_TEMP/zoption-release-config.json"
          node "$GITHUB_WORKSPACE/scripts/android-release-metadata.mjs" \
            < "$RUNNER_TEMP/zoption-release-config.json" >> "$GITHUB_ENV"

      - name: Configure server push
        env:
          ANDROID_GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
          EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
        run: |
          if [ -z "$ANDROID_GOOGLE_SERVICES_JSON" ] || [ -z "$EXPO_PROJECT_ID" ]; then
            echo "::notice::ANDROID_GOOGLE_SERVICES_JSON or EXPO_PROJECT_ID is not set; this bundle has no server push."
            exit 0
          fi
          printf '%s' "$ANDROID_GOOGLE_SERVICES_JSON" > "$RUNNER_TEMP/google-services.json"
          echo "GOOGLE_SERVICES_JSON=$RUNNER_TEMP/google-services.json" >> "$GITHUB_ENV"
          echo "EAS_PROJECT_ID=$EXPO_PROJECT_ID" >> "$GITHUB_ENV"

      - name: Prebuild Android (production, Play)
        working-directory: apps/mobile
        run: CI=1 npx expo prebuild --platform android --clean --no-install

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # The signing config injected by with-android-release-signing reads the
      # ANDROID_KEYSTORE_* environment; here it points at the upload key.
      - name: Prepare upload keystore
        run: |
          SIGNING_DIR="$RUNNER_TEMP/zoption-signing"
          mkdir -p "$SIGNING_DIR"
          printf '%s' "$PLAY_UPLOAD_KEYSTORE_BASE64" | base64 -d > "$SIGNING_DIR/zoption-upload.keystore"
          chmod 600 "$SIGNING_DIR/zoption-upload.keystore"
          echo "ANDROID_KEYSTORE_PATH=$SIGNING_DIR/zoption-upload.keystore" >> "$GITHUB_ENV"
        env:
          PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}

      - name: Raise Gradle memory for release bundle
        working-directory: apps/mobile/android
        run: |
          if ! grep -q '^org.gradle.jvmargs=' gradle.properties; then
            echo "::error::Expected org.gradle.jvmargs in generated gradle.properties."
            exit 1
          fi
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError/' gradle.properties

      - name: Bundle upload-signed release AAB
        working-directory: apps/mobile/android
        run: ./gradlew bundleRelease --no-daemon
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.ANDROID_KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
          EXPO_PUBLIC_API_URL: ${{ env.VITE_API_URL }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ env.VITE_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ env.VITE_SUPABASE_PUBLISHABLE_KEY }}
          EXPO_PUBLIC_POSTHOG_KEY: ${{ secrets.EXPO_PUBLIC_POSTHOG_KEY }}
          EXPO_PUBLIC_POSTHOG_HOST: ${{ vars.EXPO_PUBLIC_POSTHOG_HOST }}
          EXPO_PUBLIC_TELEMETRY_DISABLED: ${{ vars.EXPO_PUBLIC_TELEMETRY_DISABLED }}
          POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
          POSTHOG_CLI_PROJECT_ID: "549527"
          POSTHOG_CLI_HOST: https://us.posthog.com

      # Hard gate: the bundle is signed by the upload key (never the sideload
      # key), carries the release identity, and has no install-packages permission.
      - name: Verify AAB signer and identity
        env:
          EXPECTED_UPLOAD_FINGERPRINT: ${{ vars.PLAY_UPLOAD_CERT_SHA256 }}
        run: |
          AAB=$(find apps/mobile/android/app/build/outputs/bundle/release -name '*.aab' -print -quit)
          test -n "$AAB" || { echo "::error::No release AAB was produced."; exit 1; }
          jarsigner -verify "$AAB" > /dev/null || { echo "::error::jarsigner rejected the AAB signature."; exit 1; }
          FINGERPRINT=$(keytool -printcert -jarfile "$AAB" | awk '/SHA256:/ {print $2; exit}')
          test -n "$FINGERPRINT" || { echo "::error::Could not read the AAB signer certificate."; exit 1; }
          echo "Upload certificate SHA-256: $FINGERPRINT"
          if [ "$FINGERPRINT" = "$SIDELOAD_FINGERPRINT" ]; then
            echo "::error::The AAB is signed with the sideload APK key; use the separate Play upload key."; exit 1
          fi
          if [ -n "$EXPECTED_UPLOAD_FINGERPRINT" ] && [ "$FINGERPRINT" != "$EXPECTED_UPLOAD_FINGERPRINT" ]; then
            echo "::error::Signer $FINGERPRINT does not match PLAY_UPLOAD_CERT_SHA256."; exit 1
          fi
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/bundletool.jar" \
            "https://github.com/google/bundletool/releases/download/$BUNDLETOOL_VERSION/bundletool-all-$BUNDLETOOL_VERSION.jar"
          echo "$BUNDLETOOL_SHA256  $RUNNER_TEMP/bundletool.jar" | sha256sum -c -
          java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle "$AAB" > "$RUNNER_TEMP/zoption-aab-manifest.xml"
          MANIFEST="$RUNNER_TEMP/zoption-aab-manifest.xml"
          grep -q "package=\"$ANDROID_PACKAGE\"" "$MANIFEST" \
            || { echo "::error::AAB package is not $ANDROID_PACKAGE."; exit 1; }
          grep -q "android:versionCode=\"$RELEASE_VERSION_CODE\"" "$MANIFEST" \
            || { echo "::error::AAB versionCode is not $RELEASE_VERSION_CODE."; exit 1; }
          grep -q "android:versionName=\"$RELEASE_VERSION_NAME\"" "$MANIFEST" \
            || { echo "::error::AAB versionName is not $RELEASE_VERSION_NAME."; exit 1; }
          if grep -q 'uses-permission[^>]*REQUEST_INSTALL_PACKAGES' "$MANIFEST"; then
            echo "::error::The Play bundle must not request REQUEST_INSTALL_PACKAGES."; exit 1
          fi
          cp "$AAB" "$RUNNER_TEMP/zoption-play-$RELEASE_VERSION_NAME-$RELEASE_VERSION_CODE.aab"
          echo "AAB_PATH=$RUNNER_TEMP/zoption-play-$RELEASE_VERSION_NAME-$RELEASE_VERSION_CODE.aab" >> "$GITHUB_ENV"
          echo "AAB verified: $ANDROID_PACKAGE $RELEASE_VERSION_NAME ($RELEASE_VERSION_CODE)"

      # A universal APK of the same bundle, signed with the upload key, for installing the Play
      # build on a test phone without a Play upload (Play rejects a reused versionCode, and
      # Internal app sharing needs a published app). Uninstall any other Zoption first: the
      # signer differs from both the website APK and Play's app signing key.
      - name: Build universal APK from the AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          java -jar "$RUNNER_TEMP/bundletool.jar" build-apks --mode=universal \
            --bundle "$AAB_PATH" --output "$RUNNER_TEMP/zoption-universal.apks" \
            --ks "$ANDROID_KEYSTORE_PATH" --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" --key-pass "pass:$ANDROID_KEY_PASSWORD"
          APK="$RUNNER_TEMP/zoption-play-$RELEASE_VERSION_NAME-$RELEASE_VERSION_CODE-universal.apk"
          unzip -p "$RUNNER_TEMP/zoption-universal.apks" universal.apk > "$APK"
          test -s "$APK" || { echo "::error::bundletool produced no universal APK."; exit 1; }
          echo "UNIVERSAL_APK_PATH=$APK" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zoption-play-${{ env.RELEASE_VERSION_NAME }}-${{ env.RELEASE_VERSION_CODE }}
          path: |
            ${{ env.AAB_PATH }}
            ${{ env.UNIVERSAL_APK_PATH }}
          if-no-files-found: error
          retention-days: 14
