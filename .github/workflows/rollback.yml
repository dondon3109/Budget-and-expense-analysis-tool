name: Production Rollback

# Puts production back on an earlier release on request (.github/actions/rollback-production holds
# the steps, shared with the release's automatic rollback). It shares the production environment,
# so a human approves it, and the deploy concurrency group, so it never overlaps a release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Released version to restore, without the v (e.g. 3.4.0)"
        required: true
        type: string
      reason:
        description: "Why production is being rolled back (recorded on the Worker version)"
        required: true
        type: string
      allow_newer_migrations:
        description: "Proceed even though D1 migrations landed after this version"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/rollback-production
        with:
          version: ${{ inputs.version }}
          reason: ${{ inputs.reason }}
          allow-newer-migrations: ${{ inputs.allow_newer_migrations }}
