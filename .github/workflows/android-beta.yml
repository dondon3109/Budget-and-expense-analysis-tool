name: Android Beta Build

on:
  workflow_dispatch:
    inputs:
      publish_apk:
        description: "Upload the verified APK to R2 and re-verify the public object"
        type: boolean
        required: true
        default: false
      publish_latest_json:
        description: "Verify the public R2 APK, then upload android/latest.json"
        type: boolean
        required: true
        default: false
      release_notes:
        description: "User-facing release notes for android/latest.json (one line per bullet)"
        type: string
        required: false
        default: ""

# The workflow stays read-only over the repository: it publishes artifacts to
# R2 but never commits. After publication, refresh the website fallback through
# the explicit post-release procedure in docs/mobile/build-instructions.md.
permissions:
  contents: read

concurrency:
  group: android-beta-build
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.9.0
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17

      - run: pnpm install --frozen-lockfile

      # Reuses the web pipeline's validated public production configuration;
      # writes VITE_API_URL / VITE_SUPABASE_URL / VITE_SUPABASE_PUBLISHABLE_KEY
      # to the job environment.
      - name: Export production public configuration
        run: node scripts/export-production-deployment-env.mjs

      # A release bump edits exactly two files: package.json for the release
      # version name, app.config.ts for the Android versionCode. Resolve both
      # once so every later publish/verify step shares a single derived
      # identity instead of repeating literals that drift between releases.
      - name: Resolve Android release identity
        working-directory: apps/mobile
        env:
          APP_VARIANT: production
          EAS_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
        run: |
          pnpm exec expo config --type introspect --json > "$RUNNER_TEMP/zoption-release-config.json"
          node "$GITHUB_WORKSPACE/scripts/android-release-metadata.mjs" \
            < "$RUNNER_TEMP/zoption-release-config.json" >> "$GITHUB_ENV"

      - name: Resolve OTA runtime and native fingerprint
        if: vars.EXPO_PROJECT_ID != ''
        working-directory: apps/mobile
        env:
          APP_VARIANT: production
          EAS_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
        run: |
          pnpm run verify:ota-signing
          pnpm exec expo config --type introspect --json > "$RUNNER_TEMP/zoption-ota-config.json"
          pnpm exec expo-updates fingerprint:generate --platform android > "$RUNNER_TEMP/zoption-native-fingerprint.json"
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from "node:fs";
          const config = JSON.parse(readFileSync(process.env.RUNNER_TEMP + "/zoption-ota-config.json", "utf8"));
          const fingerprint = JSON.parse(readFileSync(process.env.RUNNER_TEMP + "/zoption-native-fingerprint.json", "utf8"));
          const expectedUrl = `https://u.expo.dev/${process.env.EAS_PROJECT_ID}`;
          if (config.updates?.enabled !== true || config.updates?.url !== expectedUrl) {
            throw new Error("Production OTA configuration is not enabled for this EAS project.");
          }
          if (config.updates?.requestHeaders?.["expo-channel-name"] !== "production") {
            throw new Error("The production APK is not pinned to the production OTA channel.");
          }
          if (config.runtimeVersion?.policy !== "appVersion") {
            throw new Error("OTA runtimeVersion must remain bound to appVersion.");
          }
          if (
            config.updates?.codeSigningCertificate !== "./certs/ota-production.pem" ||
            config.updates?.codeSigningMetadata?.keyid !== "main" ||
            config.updates?.codeSigningMetadata?.alg !== "rsa-v1_5-sha256"
          ) {
            throw new Error("Production OTA code-signing trust is not pinned correctly.");
          }
          if (!/^[0-9a-f]{40}$/.test(fingerprint.hash)) {
            throw new Error("Expo did not produce a valid Android native fingerprint.");
          }
          if (
            config.version !== process.env.RELEASE_VERSION_NAME ||
            config.android?.versionCode !== Number(process.env.RELEASE_VERSION_CODE)
          ) {
            throw new Error("Resolved OTA runtime drifted from the resolved Android release identity.");
          }
          const certificateSha256 = "0981ef1b233b9eb5b2de46c675effda0c50ade8724c04ac9d4d478c5ba2ed2e6";
          appendFileSync(
            process.env.GITHUB_ENV,
            `OTA_RUNTIME_VERSION=${config.version}\nOTA_VERSION_CODE=${config.android.versionCode}\nOTA_NATIVE_FINGERPRINT=${fingerprint.hash}\nOTA_SIGNING_CERTIFICATE_SHA256=${certificateSha256}\n`,
          );
          console.log(`Resolved OTA runtime ${config.version} and its native fingerprint.`);
          NODE

      - name: Prebuild Android (production)
        working-directory: apps/mobile
        run: CI=1 APP_VARIANT=production npx expo prebuild --platform android --clean --no-install
        env:
          # Optional until the first OTA-capable APK release. When configured,
          # app.config.ts embeds the production EAS channel in the new binary.
          EAS_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}

      - name: Verify generated OTA native configuration
        if: vars.EXPO_PROJECT_ID != ''
        working-directory: apps/mobile
        env:
          EAS_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          STRINGS=android/app/src/main/res/values/strings.xml
          grep -Eq 'expo.modules.updates.ENABLED[^>]*android:value="true"' "$MANIFEST" \
            || { echo "::error::Generated Android manifest does not enable Expo Updates."; exit 1; }
          grep -Fq "https://u.expo.dev/$EAS_PROJECT_ID" "$MANIFEST" \
            || { echo "::error::Generated Android manifest has the wrong OTA URL."; exit 1; }
          grep -Fq 'expo.modules.updates.UPDATES_CONFIGURATION_REQUEST_HEADERS_KEY' "$MANIFEST" \
            || { echo "::error::Generated Android manifest has no OTA channel header."; exit 1; }
          grep -Fq 'expo-channel-name' "$MANIFEST" && grep -Fq 'production' "$MANIFEST" \
            || { echo "::error::Generated Android manifest is not pinned to the production OTA channel."; exit 1; }
          grep -Fq ">${OTA_RUNTIME_VERSION}</string>" "$STRINGS" \
            || { echo "::error::Generated Android runtimeVersion does not match appVersion."; exit 1; }
          grep -Fq 'expo.modules.updates.CODE_SIGNING_CERTIFICATE' "$MANIFEST" \
            || { echo "::error::Generated Android manifest has no pinned OTA certificate."; exit 1; }
          grep -Fq 'expo.modules.updates.CODE_SIGNING_METADATA' "$MANIFEST" \
            || { echo "::error::Generated Android manifest has no OTA signing metadata."; exit 1; }
          grep -Fq 'rsa-v1_5-sha256' "$MANIFEST" \
            || { echo "::error::Generated Android manifest has the wrong OTA signing algorithm."; exit 1; }
          OTA_ANDROID_MANIFEST_PATH="$MANIFEST" pnpm run verify:ota-signing

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # The release signing config injected by the prebuild plugin reads the
      # CI environment; the keystore itself never touches the working tree.
      - name: Prepare release keystore
        run: |
          SIGNING_DIR="$RUNNER_TEMP/zoption-signing"
          mkdir -p "$SIGNING_DIR"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$SIGNING_DIR/zoption-release.keystore"
          chmod 600 "$SIGNING_DIR/zoption-release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$SIGNING_DIR/zoption-release.keystore" >> "$GITHUB_ENV"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      # expo prebuild writes -Xmx2048m. Release assembles can exhaust heap, and
      # expo-updates KSP needs more than the generated 512 MiB metaspace cap.
      # Raise both on the ephemeral generated tree only; this does not change
      # signing, verification, or publish gates.
      - name: Raise Gradle memory for release assemble
        working-directory: apps/mobile/android
        run: |
          if ! grep -q '^org.gradle.jvmargs=' gradle.properties; then
            echo "::error::Expected org.gradle.jvmargs in generated gradle.properties."
            exit 1
          fi
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError/' gradle.properties
          grep '^org.gradle.jvmargs=' gradle.properties

      - name: Assemble signed release APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon
        env:
          APP_VARIANT: production
          EAS_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
          ANDROID_KEYSTORE_PATH: ${{ env.ANDROID_KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPO_PUBLIC_API_URL: ${{ env.VITE_API_URL }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ env.VITE_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ env.VITE_SUPABASE_PUBLISHABLE_KEY }}
          # Crash telemetry is operator-gated: the secret enables it in built
          # artifacts, and the repository variable hard-disables it in every
          # build produced while set (devices pick that up via OTA/APK).
          EXPO_PUBLIC_POSTHOG_KEY: ${{ secrets.EXPO_PUBLIC_POSTHOG_KEY }}
          EXPO_PUBLIC_POSTHOG_HOST: ${{ vars.EXPO_PUBLIC_POSTHOG_HOST }}
          EXPO_PUBLIC_TELEMETRY_DISABLED: ${{ vars.EXPO_PUBLIC_TELEMETRY_DISABLED }}

      # Hard gate: the APK must be signed by the permanent Zoption key
      # (F9:46:70:EB...) and carry the production app identity. Failure here
      # fails the workflow.
      - name: Verify APK signing identity
        run: |
          APK=$(find apps/mobile/android/app/build/outputs/apk/release -name '*.apk' -print -quit)
          test -n "$APK" || { echo "::error::No release APK was produced."; exit 1; }
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)
          EXPECTED_FINGERPRINT="f94670eb9411f3da683a1333dd7f6c6958b0083ccec47e75894c38dbc6a5a58d"
          EXPECTED_DN="CN=Zoption, O=Zoption, C=PH"
          echo "APK: $APK"
          echo "apksigner: $APKSIGNER"
          "$APKSIGNER" verify "$APK" || { echo "::error::apksigner verify rejected the APK signature."; exit 1; }
          "$APKSIGNER" verify --print-certs "$APK" > /tmp/zoption-apk-certs.txt
          cat /tmp/zoption-apk-certs.txt
          # The cert block format differs between build-tools releases: older
          # apksigner prints "Signer #N certificate ...", newer prints
          # "V2 Signer: certificate ...". Match the shared suffix instead.
          grep -q "certificate SHA-256 digest: $EXPECTED_FINGERPRINT" /tmp/zoption-apk-certs.txt \
            || { echo "::error::Certificate SHA-256 digest does not match the permanent Zoption key."; exit 1; }
          grep -q "certificate DN: $EXPECTED_DN" /tmp/zoption-apk-certs.txt \
            || { echo "::error::Certificate DN does not match $EXPECTED_DN."; exit 1; }
          SIGNER_COUNT=$(grep -o "certificate SHA-256 digest: [0-9a-f]*" /tmp/zoption-apk-certs.txt | sort -u | wc -l | tr -d ' ')
          if [ "$SIGNER_COUNT" != "1" ]; then
            echo "::error::Expected exactly one signer, found $SIGNER_COUNT."; exit 1;
          fi
          "$AAPT" dump badging "$APK" > /tmp/zoption-apk-badging.txt
          grep "^package: name=" /tmp/zoption-apk-badging.txt
          grep -q "package: name='$ANDROID_PACKAGE' versionCode='$RELEASE_VERSION_CODE' versionName='$RELEASE_VERSION_NAME'" /tmp/zoption-apk-badging.txt \
            || { echo "::error::APK package identity or version does not match $ANDROID_PACKAGE / $RELEASE_VERSION_CODE / $RELEASE_VERSION_NAME."; exit 1; }
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > /tmp/zoption-apk-manifest.txt
          grep -q "REQUEST_INSTALL_PACKAGES" /tmp/zoption-apk-manifest.txt \
            || { echo "::error::APK is missing REQUEST_INSTALL_PACKAGES."; exit 1; }
          grep -q "ZoptionApkFileProvider" /tmp/zoption-apk-manifest.txt \
            || { echo "::error::APK is missing the restricted updater FileProvider."; exit 1; }
          grep -q "site.zoption.android.zoption.apkupdater" /tmp/zoption-apk-manifest.txt \
            || { echo "::error::APK FileProvider authority is not the updater authority."; exit 1; }
          echo "APK signing verified: $EXPECTED_FINGERPRINT"

      # Intentionally no artifact upload: the signed APK exists only on the
      # ephemeral runner during build verification and is never retained by
      # GitHub Actions.

      - name: Compute APK digest and size
        run: |
          APK=$(find apps/mobile/android/app/build/outputs/apk/release -name '*.apk' -print -quit)
          APK_SHA256=$(shasum -a 256 "$APK" | awk '{print $1}')
          APK_SIZE=$(stat -c%s "$APK")
          echo "APK_SHA256=$APK_SHA256" >> "$GITHUB_ENV"
          echo "APK_SIZE=$APK_SIZE" >> "$GITHUB_ENV"
          echo "APK SHA-256: $APK_SHA256"
          echo "APK size: $APK_SIZE bytes"

      # Phase 3: publish the verified APK to the Zoption R2 bucket. This step
      # only runs after every signing/identity gate above has passed.
      - name: Require a new version code for the OTA bootstrap APK
        if: inputs.publish_apk && vars.EXPO_PROJECT_ID != ''
        run: |
          curl -fsS --retry 5 --retry-delay 3 --max-time 30 \
            https://downloads.zoption.site/android/latest.json \
            -o /tmp/zoption-current-latest.json
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const current = JSON.parse(readFileSync("/tmp/zoption-current-latest.json", "utf8"));
          const candidateVersionCode = Number(process.env.OTA_VERSION_CODE);
          if (!Number.isInteger(candidateVersionCode) || current.versionCode >= candidateVersionCode) {
            throw new Error(
              `OTA bootstrap requires a new Android versionCode; live=${current.versionCode}, candidate=${candidateVersionCode}.`,
            );
          }
          console.log(`OTA bootstrap versionCode advances ${current.versionCode} -> ${candidateVersionCode}.`);
          NODE

      - name: Publish APK to R2
        if: inputs.publish_apk
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: "true"
          R2_ENDPOINT: https://${{ vars.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET: ${{ vars.R2_BUCKET_NAME }}
          OBJECT_KEY: ${{ env.APK_OBJECT_KEY }}
        run: |
          APK=$(find apps/mobile/android/app/build/outputs/apk/release -name '*.apk' -print -quit)
          aws s3api put-object \
            --endpoint-url "$R2_ENDPOINT" \
            --region auto \
            --bucket "$R2_BUCKET" \
            --key "$OBJECT_KEY" \
            --body "$APK" \
            --content-type application/vnd.android.package-archive
          echo "uploaded s3://$R2_BUCKET/$OBJECT_KEY"

      # Phase 4: re-verify the PUBLIC object through the Zoption domain. Never
      # trust only the local CI build.
      - name: Verify public R2 APK
        if: inputs.publish_apk
        env:
          PUBLIC_URL: ${{ env.APK_PUBLIC_URL }}
          EXPECTED_FINGERPRINT: f94670eb9411f3da683a1333dd7f6c6958b0083ccec47e75894c38dbc6a5a58d
          EXPECTED_DN: CN=Zoption, O=Zoption, C=PH
          EXPECTED_SHA256: ${{ env.APK_SHA256 }}
          EXPECTED_SIZE: ${{ env.APK_SIZE }}
        run: |
          curl -fsS --retry 5 --retry-delay 5 --max-time 60 "$PUBLIC_URL" -o /tmp/zoption-public.apk
          PUBLIC_SHA256=$(shasum -a 256 /tmp/zoption-public.apk | awk '{print $1}')
          PUBLIC_SIZE=$(stat -c%s /tmp/zoption-public.apk)
          if [ "$PUBLIC_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "::error::public APK SHA-256 mismatch: $PUBLIC_SHA256 vs $EXPECTED_SHA256"; exit 1;
          fi
          if [ "$PUBLIC_SIZE" != "$EXPECTED_SIZE" ]; then
            echo "::error::public APK size mismatch: $PUBLIC_SIZE vs $EXPECTED_SIZE"; exit 1;
          fi
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)
          "$APKSIGNER" verify /tmp/zoption-public.apk
          "$APKSIGNER" verify --print-certs /tmp/zoption-public.apk > /tmp/zoption-public-certs.txt
          grep -q "certificate SHA-256 digest: $EXPECTED_FINGERPRINT" /tmp/zoption-public-certs.txt \
            || { echo "::error::public APK certificate does not match the permanent Zoption key."; exit 1; }
          grep -q "certificate DN: $EXPECTED_DN" /tmp/zoption-public-certs.txt \
            || { echo "::error::public APK certificate DN mismatch."; exit 1; }
          if [ "$(grep -o 'certificate SHA-256 digest: [0-9a-f]*' /tmp/zoption-public-certs.txt | sort -u | wc -l | tr -d ' ')" != "1" ]; then
            echo "::error::public APK has more than one signer."; exit 1;
          fi
          "$AAPT" dump badging /tmp/zoption-public.apk > /tmp/zoption-public-badging.txt
          grep -q "package: name='$ANDROID_PACKAGE' versionCode='$RELEASE_VERSION_CODE' versionName='$RELEASE_VERSION_NAME'" /tmp/zoption-public-badging.txt \
            || { echo "::error::public APK package identity or version mismatch."; exit 1; }
          echo "public APK verified: sha256=$PUBLIC_SHA256 size=$PUBLIC_SIZE"

      # Phase 5: publish android/latest.json LAST, only after the public APK
      # passes every verification gate. The metadata is built from the verified
      # public object, never from unverified local values.
      - name: Publish android/latest.json
        if: inputs.publish_latest_json
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: "true"
          R2_ENDPOINT: https://${{ vars.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET: ${{ vars.R2_BUCKET_NAME }}
          PUBLIC_URL: ${{ env.APK_PUBLIC_URL }}
          PUBLIC_LATEST_URL: https://downloads.zoption.site/android/latest.json
          EXPECTED_FINGERPRINT: f94670eb9411f3da683a1333dd7f6c6958b0083ccec47e75894c38dbc6a5a58d
          EXPECTED_DN: CN=Zoption, O=Zoption, C=PH
          EAS_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
          OTA_SOURCE_COMMIT: ${{ github.sha }}
          RELEASE_NOTES_INPUT: ${{ inputs.release_notes }}
        run: |
          curl -fsS --retry 5 --retry-delay 5 --max-time 60 "$PUBLIC_URL" -o /tmp/zoption-public.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)
          "$APKSIGNER" verify /tmp/zoption-public.apk \
            || { echo "::error::public APK signature verification failed; latest.json was not published."; exit 1; }
          "$APKSIGNER" verify --print-certs /tmp/zoption-public.apk > /tmp/zoption-public-certs.txt
          grep -q "certificate SHA-256 digest: $EXPECTED_FINGERPRINT" /tmp/zoption-public-certs.txt \
            || { echo "::error::public APK certificate mismatch; latest.json was not published."; exit 1; }
          grep -q "certificate DN: $EXPECTED_DN" /tmp/zoption-public-certs.txt \
            || { echo "::error::public APK certificate DN mismatch; latest.json was not published."; exit 1; }
          if [ "$(grep -o 'certificate SHA-256 digest: [0-9a-f]*' /tmp/zoption-public-certs.txt | sort -u | wc -l | tr -d ' ')" != "1" ]; then
            echo "::error::public APK has more than one signer; latest.json was not published."; exit 1;
          fi
          "$AAPT" dump badging /tmp/zoption-public.apk > /tmp/zoption-public-badging.txt
          grep -q "package: name='$ANDROID_PACKAGE' versionCode='$RELEASE_VERSION_CODE' versionName='$RELEASE_VERSION_NAME'" /tmp/zoption-public-badging.txt \
            || { echo "::error::public APK identity mismatch; latest.json was not published."; exit 1; }
          PUBLIC_SHA256=$(shasum -a 256 /tmp/zoption-public.apk | awk '{print $1}')
          PUBLIC_SIZE=$(stat -c%s /tmp/zoption-public.apk)
          RELEASED_AT=$(date -u +%F)
          NOTES_JSON=$(RELEASE_NOTES_INPUT="$RELEASE_NOTES_INPUT" node -e '
            const raw = process.env.RELEASE_NOTES_INPUT ?? "";
            const notes = raw.split("\n").map((line) => line.trim()).filter(Boolean);
            process.stdout.write(JSON.stringify(notes.length > 0 ? notes : ["Signed Zoption Beta release."]));
          ')
          cat > /tmp/zoption-latest.json <<JSON
          {
            "version": "$RELEASE_VERSION_NAME",
            "versionCode": $RELEASE_VERSION_CODE,
            "downloadUrl": "$APK_PUBLIC_URL",
            "sha256": "${PUBLIC_SHA256}",
            "certificateSha256": "F9:46:70:EB:94:11:F3:DA:68:3A:13:33:DD:7F:6C:69:58:B0:08:3C:CE:C4:7E:75:89:4C:38:DB:C6:A5:A5:8D",
            "size": ${PUBLIC_SIZE},
            "releasedAt": "${RELEASED_AT}",
            "minimumAndroidVersion": "Android 7.0 or newer (API 24+)",
            "reinstallRequired": false,
            "notes": ${NOTES_JSON}
          }
          JSON
          if [ -n "$EAS_PROJECT_ID" ]; then
            if [ "$PUBLIC_SHA256" != "$APK_SHA256" ] || [ "$PUBLIC_SIZE" != "$APK_SIZE" ]; then
              echo "::error::OTA metadata requires the public APK to match this job's verified build."
              exit 1
            fi
            node --input-type=module -e '
              import { readFileSync, writeFileSync } from "node:fs";
              const path = "/tmp/zoption-latest.json";
              const metadata = JSON.parse(readFileSync(path, "utf8"));
              metadata.otaRuntimeVersion = process.env.OTA_RUNTIME_VERSION;
              metadata.otaNativeFingerprint = process.env.OTA_NATIVE_FINGERPRINT;
              metadata.otaSourceCommit = process.env.OTA_SOURCE_COMMIT;
              metadata.otaSigningCertificateSha256 = process.env.OTA_SIGNING_CERTIFICATE_SHA256;
              writeFileSync(path, JSON.stringify(metadata, null, 2) + "\n");
            '
          fi
          node --experimental-strip-types -e "
            import { readFileSync } from 'node:fs';
            import { parseRemoteAndroidRelease } from './apps/web/src/releases/androidReleaseMetadata.ts';
            const raw = JSON.parse(readFileSync('/tmp/zoption-latest.json', 'utf8'));
            const parsed = parseRemoteAndroidRelease(raw);
            if (!parsed) {
              console.error('parseRemoteAndroidRelease rejected android/latest.json');
              process.exit(1);
            }
            if (
              parsed.versionName !== process.env.RELEASE_VERSION_NAME ||
              parsed.versionCode !== Number(process.env.RELEASE_VERSION_CODE)
            ) {
              console.error('latest.json identity mismatch', parsed.versionName, parsed.versionCode);
              process.exit(1);
            }
            if (parsed.reinstallRequired !== false) {
              console.error('latest.json must set reinstallRequired=false');
              process.exit(1);
            }
            if (parsed.downloadPath !== process.env.APK_PUBLIC_URL) {
              console.error('latest.json download URL is not the versioned R2 object');
              process.exit(1);
            }
            if (process.env.EAS_PROJECT_ID) {
              if (raw.otaRuntimeVersion !== process.env.OTA_RUNTIME_VERSION) {
                console.error('latest.json OTA runtime does not match the verified APK');
                process.exit(1);
              }
              if (raw.otaNativeFingerprint !== process.env.OTA_NATIVE_FINGERPRINT) {
                console.error('latest.json native fingerprint does not match the verified APK');
                process.exit(1);
              }
