<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0c1512" />
    <title>Connection required — Zoption</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: ui-sans-serif, system-ui, sans-serif;
        color: #0c1512;
        background: #f1f3f2;
      }
      * {
        box-sizing: border-box;
      }
      body {
        min-width: 320px;
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
        display: grid;
        place-items: center;
        background: #f1f3f2;
      }
      main {
        width: min(560px, 100%);
        padding: clamp(28px, 7vw, 52px);
        border: 1px solid #e2e6e4;
        border-radius: 20px;
        background: #fff;
        box-shadow: 0 24px 70px rgba(12, 21, 18, 0.1);
      }
      img {
        width: 64px;
        height: 64px;
        border-radius: 16px;
      }
      h1 {
        margin: 24px 0 12px;
        font-family: ui-sans-serif, system-ui, sans-serif;
        font-size: clamp(36px, 9vw, 54px);
        font-weight: 700;
        letter-spacing: -0.035em;
        line-height: 1.04;
      }
      p {
        margin: 0;
        color: #545f5a;
        font-size: 16px;
        line-height: 1.65;
      }
      a {
        min-height: 46px;
        margin-top: 28px;
        padding: 0 18px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        border-radius: 12px;
        background: #0c1512;
        font-weight: 700;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 3px solid #0a7556;
        outline-offset: 4px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color: #edf2f0;
          background: #080b0a;
        }
        body {
          background: #080b0a;
        }
        main {
          border-color: #222b29;
          background: #111615;
        }
        p {
          color: #a3adaa;
        }
        a {
          color: #04140e;
          background: #5fe3b8;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/brand/favicon-64.png" width="64" height="64" alt="" />
      <h1>Connection required.</h1>
      <p>
        Zoption is online-first. Reconnect before opening your private workspace or saving a
        financial change. No financial data was loaded or stored by this offline page.
      </p>
      <a href="/app">Try Zoption again</a>
    </main>
  </body>
</html>
