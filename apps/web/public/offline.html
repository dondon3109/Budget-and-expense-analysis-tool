<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#06473d" />
    <title>Connection required — Zoption</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Manrope, ui-sans-serif, system-ui, sans-serif;
        color: #17342e;
        background: #f4f1e9;
      }
      * {
        box-sizing: border-box;
      }
      body {
        min-width: 320px;
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 70% 15%, #d5f4ea, transparent 34%), #f4f1e9;
      }
      main {
        width: min(560px, 100%);
        padding: clamp(28px, 7vw, 52px);
        border: 1px solid #d9d5cb;
        border-radius: 20px;
        background: #fffdf8;
        box-shadow: 0 24px 70px rgba(35, 51, 44, 0.12);
      }
      img {
        width: 64px;
        height: 64px;
        border-radius: 16px;
      }
      h1 {
        margin: 24px 0 12px;
        font-family: Georgia, serif;
        font-size: clamp(36px, 9vw, 54px);
        font-weight: 400;
        line-height: 1.04;
      }
      p {
        margin: 0;
        color: #5f6b66;
        font-size: 16px;
        line-height: 1.65;
      }
      a {
        min-height: 46px;
        margin-top: 28px;
        padding: 0 18px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        border-radius: 12px;
        background: #06473d;
        font-weight: 700;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 3px solid #2f705a;
        outline-offset: 4px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color: #f2f4f7;
          background: #0f1115;
        }
        body {
          background: radial-gradient(circle at 70% 15%, #123f35, transparent 34%), #0f1115;
        }
        main {
          border-color: #303640;
          background: #171a20;
        }
        p {
          color: #b2b8c2;
        }
        a {
          color: #102019;
          background: #67e0bc;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/brand/favicon-64.png" width="64" height="64" alt="" />
      <h1>Connection required.</h1>
      <p>
        Zoption is online-first. Reconnect before opening your private workspace or saving a
        financial change. No financial data was loaded or stored by this offline page.
      </p>
      <a href="/app">Try Zoption again</a>
    </main>
  </body>
</html>
