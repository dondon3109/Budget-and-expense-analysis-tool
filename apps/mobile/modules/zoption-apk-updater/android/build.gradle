plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'site.zoption.apkupdater'
version = '0.1.0'

android {
  namespace 'site.zoption.apkupdater'
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // React Native already resolves this version in the app. Declaring it here
  // gives the updater a direct HTTP/2-capable transport without another copy.
  implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
