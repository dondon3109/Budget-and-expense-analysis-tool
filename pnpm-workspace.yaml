packages:
  - apps/*
  - "!apps/stt-bridge"
  - packages/*

allowBuilds:
  core-js: true
  esbuild: true
  protobufjs: true
  sharp: true
  unrs-resolver: false
  workerd: true

overrides:
  "@esbuild-kit/core-utils>esbuild": 0.25.12
  "@lhci/cli>tmp": 0.2.7
  "@lhci/cli>uuid": 11.1.1
  "xcode>uuid": 11.1.1
  "external-editor>tmp": 0.2.7
  "fast-uri": 3.1.8
  "@expo/plist>@xmldom/xmldom": 0.8.15
  "plist>@xmldom/xmldom": 0.9.12
  "puppeteer-core>@puppeteer/browsers": 3.2.1
  "js-yaml@3": 3.15.2
  "js-yaml@4": 4.3.2
  "sharp": 0.35.5
  "undici@6": 6.28.1
  "undici@7": 7.29.1
  "brace-expansion@1": 1.1.21
  "brace-expansion@2": 2.1.7
  "brace-expansion@5": 5.0.12
  "qs": 6.16.0
  "ip-address": 10.7.1
  "dompurify": 3.4.16
  "basic-ftp": 6.2.1
  "source-map-js": 1.2.2
  "proxy-addr": 2.0.8
  "compression": 1.8.2
  "shell-quote": 1.11.0
  "http-cache-semantics": 4.3.0
  # Tailwind 3 (under nativewind) still asks for ^6, and the 6.x line has no fix for
  # GHSA-rj75-hqrm-r3gf. 7.x keeps the API Tailwind 3 uses; the mobile CSS output is identical.
  "postcss-selector-parser@6": 7.1.6

auditConfig:
  ignoreGhsas:
    # Paired with patches/decode-uri-component@0.2.2.patch, which backports the 0.5.0 fix
    # for this DoS. Keep the patch and this ignore together; the ignore without the patch
    # would hide a real advisory.
    - GHSA-vcc3-ghjq-m6fr
    # node-forge <=1.4.0 RSA PKCS#1 v1.5 signature forgery; no patched release exists yet.
    # Only reachable through @expo/cli (dev-server and code-signing certificates), never in
    # a shipped bundle. Replace with a "node-forge" override once 1.4.1 is published.
    - GHSA-86w9-cpqp-85rv
    # braces <=3.0.3 stack exhaustion on deeply nested patterns; the patched 3.0.4 is not on npm
    # yet. Reached only through dev tooling (micromatch under semantic-release and expo). Replace
    # with a "braces" override once 3.0.4 is published.
    - GHSA-vfj7-8cjw-p6xm
    # sprintf-js <=1.1.3 DoS through unbounded precision specifiers; no patched release exists
    # yet. Reached only through dev tooling (argparse under @lhci/cli and Jest coverage). Replace
    # with a "sprintf-js" override once 1.1.4 is published.
    - GHSA-hp3w-g68c-fv3c

minimumReleaseAgeExclude:
  - miniflare@5.20260811.0-alpha
  - wrangler@4.122.0
  - zustand@5.0.15
  - expo-file-system@57.0.4
  - expo-constants@57.0.11
  - "@posthog/core@1.48.7"
  - "@posthog/types@1.405.1"
  - posthog-react-native@4.63.4

patchedDependencies:
  decode-uri-component@0.2.2: patches/decode-uri-component@0.2.2.patch
  react-native-screens: patches/react-native-screens.patch
